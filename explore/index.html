<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — VotZet</title>
<meta name="description" content="Explore the worlds of VotZet.">

<link rel="stylesheet" href="../css/main.css">

<style>
/* =========================================================
   EXPLORE VOTZET 1.0
   ========================================================= */

body {
    margin: 0;
    overflow-x: hidden;
    overflow-y: auto;
    background: #101113;
    color: #f2f2ef;
}

.explore-page {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(201,162,39,0.045),
            transparent 40%
        ),
        #101113;
}

/* =========================================================
   NAVIGATION
   ========================================================= */

.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 17px 12px;
    background: rgba(8,9,10,0.94);
    border-bottom: 1px solid rgba(201,162,39,0.18);
    backdrop-filter: blur(12px);
}

.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.inner-nav a:hover {
    color: #e4c44f;
}

/* =========================================================
   MAIN CONTENT
   ========================================================= */

.explore-content {
    width: 100%;
    box-sizing: border-box;
    padding: 58px 17px 75px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.explore-intro {
    width: 100%;
    max-width: 760px;
    text-align: center;
}

.brand-label {
    margin-bottom: 20px;
    color: #d8b83d;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 3px;
}

.explore-title {
    margin: 0 0 22px;
    color: #f2f2ef;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 1px;
}

.explore-subtitle {
    max-width: 700px;
    margin: 0 auto;
    color: #deded9;
    font-size: 18px;
    line-height: 1.65;
}

.explore-motto {
    margin-top: 28px;
    color: #c9a227;
    font-size: 10px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
}

/* =========================================================
   VIEW SYSTEM
   ========================================================= */

.explore-view {
    display: none;
    width: 100%;
}

.explore-view.active {
    display: block;
}

/* =========================================================
   SECTION HEADINGS
   ========================================================= */

.world-section {
    width: 100%;
    max-width: 900px;
    margin: 66px auto 0;
}

.section-heading {
    text-align: center;
    margin-bottom: 28px;
}

.section-heading h2 {
    margin: 0;
    color: #eeeeeb;
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 1px;
}

.section-heading p {
    max-width: 640px;
    margin: 12px auto 0;
    color: #85868a;
    font-size: 13px;
    line-height: 1.6;
}

/* =========================================================
   HUMAN WORLD CARDS
   ========================================================= */

.world-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
}

.world-card {
    -webkit-tap-highlight-color: transparent;
    min-height: 135px;
    box-sizing: border-box;
    padding: 25px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.012);
    color: inherit;
    font-family: inherit;
    cursor: pointer;
    transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
}

.world-card:hover {
    border-color: rgba(201,162,39,0.65);
    background: rgba(201,162,39,0.035);
    transform: translateY(-3px);
}

.world-card:focus {
    outline: none;
}

.world-card.selected {
    border-color: rgba(228,196,79,0.95);
    background: rgba(201,162,39,0.22);
    box-shadow:
        0 0 0 1px rgba(201,162,39,0.10),
        0 0 20px rgba(201,162,39,0.16);
    transform: translateY(-2px);
}

.world-card.selected h3 {
    color: #e4c44f;
}

.world-number {
    margin-bottom: 13px;
    color: #c9a227;
    font-size: 9px;
    letter-spacing: 2.5px;
}

.world-card h3 {
    margin: 0;
    color: #eeeeeb;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 1px;
    transition: color 0.18s ease;
}

.world-card p {
    margin: 8px 0 0;
    color: #85868a;
    font-size: 12.5px;
    line-height: 1.55;
}

/* =========================================================
   LEVELS OF CHOICE
   ========================================================= */

.choice-section {
    margin-top: 42px;
    padding-top: 32px;
    border-top: 1px solid rgba(201,162,39,0.18);
}

.choice-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 14px;
}

.choice-card {
    min-height: 150px;
    border-color: rgba(201,162,39,0.28);
    background:
        linear-gradient(
            135deg,
            rgba(201,162,39,0.035),
            rgba(255,255,255,0.008)
        );
}

/* =========================================================
   WORLD DETAIL VIEW
   ========================================================= */

.detail-shell {
    width: 100%;
    max-width: 820px;
    margin: 55px auto 0;
}

.detail-top {
    display: flex;
    align-items: center;
    gap: 17px;
    margin-bottom: 35px;
}

.back-button {
    -webkit-tap-highlight-color: transparent;
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 50%;
    background: transparent;
    color: #d8b83d;
    font-family: inherit;
    font-size: 19px;
    cursor: pointer;
}

.back-button:focus {
    outline: none;
}

.detail-name {
    color: #eeeeeb;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 1px;
}

.detail-question {
    margin: 0 0 28px;
    text-align: center;
    color: #eeeeeb;
    font-size: 29px;
    font-weight: 400;
    line-height: 1.25;
}

.matters-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 12px;
}

.matter-button {
    -webkit-tap-highlight-color: transparent;
    min-height: 74px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.012);
    color: #deded9;
    font-family: inherit;
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    transition:
        border-color 0.18s ease,
        background 0.18s ease,
        color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
}

.matter-button:hover {
    border-color: rgba(201,162,39,0.65);
    background: rgba(201,162,39,0.04);
    transform: translateY(-2px);
}

.matter-button:focus {
    outline: none;
}

.matter-button.selected {
    border-color: rgba(228,196,79,0.95);
    background: rgba(201,162,39,0.22);
    color: #e4c44f;
    box-shadow:
        0 0 0 1px rgba(201,162,39,0.10),
        0 0 18px rgba(201,162,39,0.16);
    transform: translateY(-1px);
}

/* =========================================================
   SOLUTIONS PLACEHOLDER
   ========================================================= */

.solutions-box {
    width: 100%;
    max-width: 720px;
    box-sizing: border-box;
    margin: 70px auto 0;
    padding: 45px 25px;
    text-align: center;
    border-top: 1px solid rgba(201,162,39,0.22);
    border-bottom: 1px solid rgba(201,162,39,0.22);
}

.solution-path {
    margin-bottom: 18px;
    color: #88898d;
    font-size: 11px;
    letter-spacing: 1.5px;
}

.solutions-box h2 {
    margin: 0;
    color: #eeeeeb;
    font-size: 35px;
    font-weight: 400;
    letter-spacing: 1px;
}

.solution-selected {
    margin: 18px 0 0;
    color: #c9a227;
    font-size: 17px;
    line-height: 1.6;
}

/* =========================================================
   FOOTER
   ========================================================= */

.explore-bottom {
    width: 100%;
    max-width: 680px;
    margin: 70px auto 0;
    text-align: center;
}

.back-home {
    display: inline-block;
    padding: 11px 25px;
    border: 1px solid rgba(201,162,39,0.75);
    border-radius: 28px;
    color: #d8b83d;
    text-decoration: none;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.back-home:hover {
    background: #d8b83d;
    color: #101113;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 650px) {

    .inner-nav {
        gap: 20px;
        padding: 16px 12px;
    }

    .inner-nav a {
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    .explore-title {
        font-size: 38px;
    }

    .explore-subtitle {
        font-size: 17px;
    }

    .world-grid,
    .choice-grid,
    .matters-grid {
        grid-template-columns: 1fr;
    }

    .world-card {
        min-height: 115px;
    }

    .detail-question {
        font-size: 25px;
    }

    .choice-section {
        margin-top: 34px;
        padding-top: 27px;
    }
}

</style>
</head>

<body>

<div class="explore-page">

<nav class="inner-nav">
    <a href="../index.html" id="navHome" data-nav-sound="home"></a>
    <a href="./" id="navExplore" data-nav-sound="explore"></a>
    <a href="../discover/" id="navDiscover" data-nav-sound="discover"></a>
</nav>

<main class="explore-content">

<!-- =====================================================
     LANDING VIEW
     ===================================================== -->

<section
    class="explore-view active"
    id="landingView"
>

    <div class="explore-intro">

        <div class="brand-label">
            VotZet
        </div>

        <h1
            class="explore-title"
            id="exploreTitle"
        ></h1>

        <p
            class="explore-subtitle"
            id="exploreSubtitle"
        ></p>

        <div class="explore-motto">
            That's your world.
        </div>

    </div>

    <!-- YOUR WORLDS -->
    <section class="world-section">

        <div class="section-heading">

            <h2 id="humanWorldsTitle"></h2>

            <p id="humanWorldsSubtitle"></p>

        </div>

        <div
            class="world-grid"
            id="humanWorldsGrid"
        ></div>

    </section>

    <!-- LEVELS OF CHOICE -->
    <section class="world-section choice-section">

        <div class="section-heading">

            <h2 id="choiceWorldsTitle"></h2>

            <p id="choiceWorldsSubtitle"></p>

        </div>

        <div
            class="choice-grid"
            id="choiceWorldsGrid"
        ></div>

    </section>

    <section class="explore-bottom">

        <a
            class="back-home"
            href="../index.html"
            id="backHome"
            data-nav-sound="home"
        ></a>

    </section>

</section>


<!-- =====================================================
     WORLD DETAIL VIEW
     ===================================================== -->

<section
    class="explore-view"
    id="detailView"
>

    <div class="detail-shell">

        <div class="detail-top">

            <button
                class="back-button"
                id="backToWorlds"
                type="button"
            >
                ←
            </button>

            <div
                class="detail-name"
                id="detailWorldName"
            ></div>

        </div>

        <h2
            class="detail-question"
            id="detailQuestion"
        ></h2>

        <div
            class="matters-grid"
            id="mattersGrid"
        ></div>

    </div>

</section>


<!-- =====================================================
     SOLUTIONS VIEW
     ===================================================== -->

<section
    class="explore-view"
    id="solutionsView"
>

    <div class="detail-shell">

        <div class="detail-top">

            <button
                class="back-button"
                id="backToDetails"
                type="button"
            >
                ←
            </button>

            <div
                class="detail-name"
                id="solutionWorldName"
            ></div>

        </div>

        <div class="solutions-box">

            <div
                class="solution-path"
                id="solutionPath"
            ></div>

            <h2 id="solutionsTitle"></h2>

            <p
                class="solution-selected"
                id="solutionSelected"
            ></p>

        </div>

    </div>

</section>

</main>
</div>


<!-- MAIN SYSTEM -->
<script src="../js/main.js"></script>

<!-- LANGUAGE SYSTEM -->
<script src="../js/language.js"></script>


<!-- =====================================================
     EXPLORE SYSTEM
     ===================================================== -->

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const language =
        localStorage.getItem("votzet-language") || "en";

    const SELECTION_DELAY = 130;

    const fallbackEnglish = {

        title: "Explore VotZet",

        subtitle:
            "Find what matters to you.",

        humanWorldsTitle:
            "Your Worlds",

        humanWorldsSubtitle:
            "Choose the one that feels closest to you or to the person you're exploring for.",

        worldsOfChoiceTitle:
            "Levels of Choice",

        worldsOfChoiceSubtitle:
            "A different approach to choosing — smart value or a premium level.",

        questions: {
            default:
                "What matters to you?",

            children:
                "What matters for a child?",

            family:
                "What matters for a family?",

            pets:
                "What matters for your pet and life together?",

            choice:
                "What are you looking for?"
        },

        solutions:
            "Solutions",

        worlds: {

            men: {
                title:
                    "Men",

                short:
                    "Health, appearance, status, safety and development.",

                items: [
                    "Health",
                    "Appearance",
                    "Status",
                    "Safety",
                    "Development"
                ]
            },

            women: {
                title:
                    "Women",

                short:
                    "Health, beauty, status, safety and development.",

                items: [
                    "Health",
                    "Beauty",
                    "Status",
                    "Safety",
                    "Development"
                ]
            },

            children: {
                title:
                    "Children",

                short:
                    "Health, learning, development, safety and more.",

                items: [
                    "Health",
                    "Safety",
                    "Learning",
                    "Development",
                    "Creativity",
                    "Play",
                    "Comfort"
                ]
            },

            seniors: {
                title:
                    "Seniors",

                short:
                    "Health, independence, comfort, connection and active living.",

                items: [
                    "Health",
                    "Safety",
                    "Independence",
                    "Mobility",
                    "Comfort",
                    "Communication",
                    "Activities"
                ]
            },

            family: {
                title:
                    "Family",

                short:
                    "Home, safety, comfort and time together.",

                items: [
                    "Health",
                    "Safety",
                    "Home",
                    "Comfort",
                    "Time Together",
                    "Travel"
                ]
            },

            pets: {
                title:
                    "Pets & Companions",

                short:
                    "Health, care, comfort and life together.",

                items: [
                    "Health",
                    "Nutrition",
                    "Safety",
                    "Care",
                    "Comfort",
                    "Play",
                    "Travel Together",
                    "Smart Pet Life"
                ]
            },

            social: {
                title:
                    "Social",

                short:
                    "Friends, loved ones, shared interests and time together.",

                items: [
                    "For Friends",
                    "For Loved Ones",
                    "Stay Connected",
                    "Shared Interests",
                    "Activities"
                ]
            }
        },

        choiceWorlds: {

            smartValue: {
                title:
                    "Smart Value",

                short:
                    "More for your money.",

                items: [
                    "Health & Wellness",
                    "Personal",
                    "Home",
                    "Family",
                    "Technology",
                    "Travel",
                    "Work & Study",
                    "Pets",
                    "Gifts",
                    "Hobbies & Leisure"
                ]
            },

            premium: {
                title:
                    "Premium",

                short:
                    "When you want more than just quality.",

                items: [
                    "Personal",
                    "Style",
                    "Technology",
                    "Home",
                    "Health & Recovery",
                    "Travel",
                    "Gifts",
                    "Discoveries"
                ]
            }
        }
    };

    const humanOrder = [
        "men",
        "women",
        "children",
        "seniors",
        "family",
        "pets",
        "social"
    ];

    const choiceOrder = [
        "smartValue",
        "premium"
    ];

    let explore = null;
    let transitionLocked = false;

    const landingView =
        document.getElementById("landingView");

    const detailView =
        document.getElementById("detailView");

    const solutionsView =
        document.getElementById("solutionsView");

    function showView(view) {

        document
            .querySelectorAll(".explore-view")
            .forEach(item => {
                item.classList.remove("active");
            });

        view.classList.add("active");

        window.scrollTo(0, 0);
    }

    function playInterfaceSound() {

        if (
            typeof window.VotZetSound === "function"
        ) {
            window.VotZetSound("document");
        }
    }

    function confirmSelection(
        element,
        callback
    ) {

        if (transitionLocked) {
            return;
        }

        transitionLocked = true;

        playInterfaceSound();

        element.classList.add("selected");

        setTimeout(() => {

            element.classList.remove("selected");

            transitionLocked = false;

            callback();

        }, SELECTION_DELAY);
    }

    async function loadCommon() {

        try {

            const response =
                await fetch(
                    `../locales/${language}/common.json`
                );

            if (!response.ok) {
                throw new Error(
                    "common.json unavailable"
                );
            }

            const common =
                await response.json();

            document.getElementById("navHome")
                .textContent =
                common.home || "Home";

            document.getElementById("navExplore")
                .textContent =
                common.explore || "Explore";

            document.getElementById("navDiscover")
                .textContent =
                common.discover || "Discover";

            document.getElementById("backHome")
                .textContent =
                common.home || "Home";

        }

        catch (error) {

            document.getElementById("navHome")
                .textContent =
                "Home";

            document.getElementById("navExplore")
                .textContent =
                "Explore";

            document.getElementById("navDiscover")
                .textContent =
                "Discover";

            document.getElementById("backHome")
                .textContent =
                "Home";
        }
    }

    async function loadExplore() {

        try {

            const response =
                await fetch(
                    `../locales/${language}/explore.json`
                );

            if (!response.ok) {
                throw new Error(
                    `explore.json unavailable: ${language}`
                );
            }

            explore =
                await response.json();

        }

        catch (error) {

            console.warn(
                "VotZet Explore fallback:",
                error
            );

            explore =
                fallbackEnglish;
        }
    }

    function renderLanding() {

        document.documentElement.lang =
            language;

        document.getElementById(
            "exploreTitle"
        ).textContent =
            explore.title || "Explore VotZet";

        document.getElementById(
            "exploreSubtitle"
        ).textContent =
            explore.subtitle || "";

        document.getElementById(
            "humanWorldsTitle"
        ).textContent =
            explore.humanWorldsTitle || "Your Worlds";

        document.getElementById(
            "humanWorldsSubtitle"
        ).textContent =
            explore.humanWorldsSubtitle || "";

        document.getElementById(
            "choiceWorldsTitle"
        ).textContent =
            explore.worldsOfChoiceTitle || "Levels of Choice";

        document.getElementById(
            "choiceWorldsSubtitle"
        ).textContent =
            explore.worldsOfChoiceSubtitle || "";

        const humanGrid =
            document.getElementById(
                "humanWorldsGrid"
            );

        humanGrid.innerHTML = "";

        humanOrder.forEach(
            (key, index) => {

                const world =
                    explore.worlds[key];

                if (!world) {
                    return;
                }

                const card =
                    createWorldCard(
                        world,
                        String(index + 1)
                            .padStart(2, "0"),
                        "human",
                        key
                    );

                humanGrid.appendChild(card);
            }
        );

        const choiceGrid =
            document.getElementById(
                "choiceWorldsGrid"
            );

        choiceGrid.innerHTML = "";

        choiceOrder.forEach(key => {

            const world =
                explore.choiceWorlds[key];

            if (!world) {
                return;
            }

            const card =
                createWorldCard(
                    world,
                    "",
                    "choice",
                    key
                );

            card.classList.add(
                "choice-card"
            );

            choiceGrid.appendChild(card);
        });
    }

    function createWorldCard(
        world,
        number,
        kind,
        key
    ) {

        const card =
            document.createElement("button");

        card.type =
            "button";

        card.className =
            "world-card";

        if (number) {

            const numberElement =
                document.createElement("div");

            numberElement.className =
                "world-number";

            numberElement.textContent =
                number;

            card.appendChild(
                numberElement
            );
        }

        const title =
            document.createElement("h3");

        title.textContent =
            world.title || "";

        const short =
            document.createElement("p");

        short.textContent =
            world.short || "";

        card.appendChild(title);
        card.appendChild(short);

        card.addEventListener(
            "click",
            () => {

                confirmSelection(
                    card,
                    () => {

                        openWorld(
                            kind,
                            key
                        );
                    }
                );
            }
        );

        return card;
    }

    function openWorld(
        kind,
        key
    ) {

        const world =
            kind === "human"
                ? explore.worlds[key]
                : explore.choiceWorlds[key];

        document.getElementById(
            "detailWorldName"
        ).textContent =
            world.title || "";

        let question =
            explore.questions.default;

        if (kind === "choice") {

            question =
                explore.questions.choice;
        }

        else if (key === "children") {

            question =
                explore.questions.children;
        }

        else if (key === "family") {

            question =
                explore.questions.family;
        }

        else if (key === "pets") {

            question =
                explore.questions.pets;
        }

        document.getElementById(
            "detailQuestion"
        ).textContent =
            question || "";

        const grid =
            document.getElementById(
                "mattersGrid"
            );

        grid.innerHTML = "";

        (world.items || [])
            .forEach(item => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "matter-button";

                button.textContent =
                    item;

                button.addEventListener(
                    "click",
                    () => {

                        confirmSelection(
                            button,
                            () => {

                                openSolutions(
                                    world,
                                    item
                                );
                            }
                        );
                    }
                );

                grid.appendChild(
                    button
                );
            });

        showView(detailView);
    }

    function openSolutions(
        world,
        selected
    ) {

        document.getElementById(
            "solutionWorldName"
        ).textContent =
            world.title || "";

        document.getElementById(
            "solutionPath"
        ).textContent =
            `${world.title} / ${selected}`;

        document.getElementById(
            "solutionsTitle"
        ).textContent =
            explore.solutions || "Solutions";

        document.getElementById(
            "solutionSelected"
        ).textContent =
            selected;

        showView(
            solutionsView
        );
    }

    document.getElementById(
        "backToWorlds"
    ).addEventListener(
        "click",
        () => {

            playInterfaceSound();

            showView(
                landingView
            );
        }
    );

    document.getElementById(
        "backToDetails"
    ).addEventListener(
        "click",
        () => {

            playInterfaceSound();

            showView(
                detailView
            );
        }
    );

    await Promise.all([
        loadCommon(),
        loadExplore()
    ]);

    renderLanding();

});
</script>

</body>
</html>
