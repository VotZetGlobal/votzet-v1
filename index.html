<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VotZet</title>
<meta name="description" content="VotZet — That's your world!">

<link rel="stylesheet" href="css/main.css">

<!-- PRELOAD: Заранее подготавливаем основные разделы VotZet -->
<link rel="prefetch" href="discover/">
<link rel="prefetch" href="explore/">

<body>

<!-- HOME: Главный экран VotZet -->
