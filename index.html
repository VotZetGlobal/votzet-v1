<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VotZet — That's your world!</title>
<meta name="description" content="VotZet — That's your world!">
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- HOME: Главный экран VotZet -->
<main id="home">
    <!-- LANGUAGE SELECTOR: Выбор одного из 25 языков -->
    <div class="language-selector" id="languageSelector">
        <button class="language-button" id="languageButton">EN ▾</button>
        <div class="language-menu">
            <button class="language-option" data-language="EN">English</button>
            <button class="language-option" data-language="ES">Español — Spanish</button>
            <button class="language-option" data-language="FR">Français — French</button>
            <button class="language-option" data-language="DE">Deutsch — German</button>
            <button class="language-option" data-language="IT">Italiano — Italian</button>
            <button class="language-option" data-language="PT">Português — Portuguese</button>
            <button class="language-option" data-language="EL">Ελληνικά — Greek</button>
            <button class="language-option" data-language="TR">Türkçe — Turkish</button>
            <button class="language-option" data-language="NL">Nederlands — Dutch</button>
            <button class="language-option" data-language="RU">Русский — Russian</button>
            <button class="language-option" data-language="KA">ქართული — Georgian</button>
            <button class="language-option" data-language="FI">Suomi — Finnish</button>
            <button class="language-option" data-language="SV">Svenska — Swedish</button>
            <button class="language-option" data-language="NO">Norsk — Norwegian</button>
            <button class="language-option" data-language="IS">Íslenska — Icelandic</button>
            <button class="language-option" data-language="GA">Gaeilge — Irish</button>
            <button class="language-option" data-language="ZH">中文 — Chinese</button>
            <button class="language-option" data-language="KO">한국어 — Korean</button>
            <button class="language-option" data-language="JA">日本語 — Japanese</button>
            <button class="language-option" data-language="TL">Filipino / Tagalog</button>
            <button class="language-option" data-language="ID">Bahasa Indonesia — Indonesian</button>
            <button class="language-option" data-language="VI">Tiếng Việt — Vietnamese</button>
            <button class="language-option" data-language="TH">ไทย — Thai</button>
            <button class="language-option" data-language="HI">हिन्दी — Hindi</button>
            <button class="language-option" data-language="AR">العربية — Arabic</button>
        </div>
    </div>

    <!-- HOME NAVIGATION: Переход в Discover и Explore -->
    <div class="home-buttons">
        <button class="home-button" id="discoverButton">DISCOVER</button>
        <button class="home-button" id="exploreButton">EXPLORE</button>
    </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
