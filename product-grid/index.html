<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Men — Health — VotZet</title>
<meta name="description" content="Selected VotZet solutions for Men — Health.">

<link rel="stylesheet" href="../css/main.css">

<style>
* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
    margin: 0;
    overflow-x: hidden;
    overflow-y: auto;
    background: #0b0c0e;
    color: #f2f2ef;
}

.product-page {
    min-height: 100svh;
    background:
        radial-gradient(circle at 50% 0%, rgba(201,162,39,.05), transparent 35%),
        #0b0c0e;
}

/* CURRENT VOTZET INNER NAV */
.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 17px 12px;
    background: rgba(8,9,10,.94);
    border-bottom: 1px solid rgba(201,162,39,.18);
    backdrop-filter: blur(12px);
}

.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.inner-nav a:hover { color: #e4c44f; }

.product-content {
    width: 100%;
    padding: 50px 16px max(55px, env(safe-area-inset-bottom));
}

.product-intro {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}

.brand-label {
    margin-bottom: 15px;
    color: #d8b83d;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.product-title {
    margin: 0;
    color: #f2f2ef;
    font-size: 40px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: 1px;
}

.product-subtitle {
    max-width: 720px;
    margin: 17px auto 0;
    color: #96979b;
    font-size: 13px;
    line-height: 1.6;
}

.title-line {
    width: 70px;
    height: 1px;
    margin: 21px auto 0;
    background: #d8b83d;
    box-shadow: 0 0 10px rgba(216,184,61,.45);
}

/* DESKTOP: 7 × 3 */
.products-grid {
    width: 100%;
    max-width: 1460px;
    margin: 38px auto 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
}

.product-card {
    position: relative;
    min-width: 0;
    aspect-ratio: 1023 / 1537;
    overflow: hidden;
    border-radius: 7px;
    background: #08090a;
    text-decoration: none;
    color: inherit;
}

.placeholder-image,
.product-image {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Hide the baked-in 01 and replace it dynamically.
   The overlay is deliberately narrow so the approved artwork stays intact. */
.dynamic-number-mask {
    position: absolute;
    left: 21%;
    right: 21%;
    top: 65.2%;
    height: 14.5%;
    z-index: 2;
    display: grid;
    place-items: center;
    background:
        radial-gradient(ellipse at center, #050607 0%, #050607 58%, rgba(5,6,7,.98) 72%, rgba(5,6,7,0) 100%);
}

.dynamic-number {
    color: #dcae32;
    font-size: clamp(20px, 2.15vw, 39px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(220,174,50,.16);
}

.product-card.active {
    border: 1px solid rgba(201,162,39,.34);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.product-card.active:hover {
    transform: translateY(-3px);
    border-color: rgba(228,196,79,.8);
    box-shadow: 0 10px 28px rgba(0,0,0,.3);
}

.active-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 28% 8px 8%;
    text-align: center;
    background: linear-gradient(to top, rgba(5,6,7,.98), rgba(5,6,7,.72), transparent);
}

.active-name {
    margin: 0;
    color: #f0f0ed;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.35;
}

.active-price {
    margin-top: 7px;
    color: #d8b83d;
    font-size: 10px;
}

/* VOTZET VALUE STRIP */
.value-strip {
    width: 100%;
    max-width: 1180px;
    margin: 34px auto 0;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 0;
    border: 1px solid rgba(228,196,79,.56);
    border-radius: 8px;
    background:
        radial-gradient(circle at 50% 50%, rgba(201,162,39,.045), transparent 62%),
        rgba(8,9,10,.88);
    box-shadow:
        0 0 22px rgba(201,162,39,.08),
        inset 0 0 18px rgba(201,162,39,.025);
}

.value-item {
    min-width: 0;
    display: grid;
    grid-template-columns: 48px 1fr;
    align-items: center;
    gap: 12px;
    padding: 3px 17px;
    border-right: 1px solid rgba(201,162,39,.18);
}

.value-item:last-child { border-right: 0; }

.value-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid #e0b83d;
    border-radius: 50%;
    color: #f0c94e;
    font-size: 19px;
    box-shadow:
        0 0 15px rgba(228,196,79,.32),
        inset 0 0 10px rgba(228,196,79,.08);
}

.value-title {
    color: #f2f2ef;
    font-size: 10px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}

.value-copy {
    margin-top: 4px;
    color: #9b9ca0;
    font-size: 8px;
    line-height: 1.45;
}

.bottom-actions {
    margin-top: 38px;
    text-align: center;
}

.back-explore {
    display: inline-block;
    padding: 11px 25px;
    border: 1px solid rgba(201,162,39,.75);
    border-radius: 28px;
    color: #d8b83d;
    text-decoration: none;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.back-explore:hover {
    background: #d8b83d;
    color: #101113;
}

/* MOBILE: 3 × 7 */
@media (max-width: 650px) {
    .inner-nav {
        gap: 20px;
        padding: 16px 12px;
    }

    .inner-nav a {
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    .product-content {
        padding: 39px 6px max(42px, env(safe-area-inset-bottom));
    }

    .product-title { font-size: 30px; }

    .product-subtitle {
        padding: 0 9px;
        font-size: 12px;
    }

    .products-grid {
        margin-top: 29px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
    }

    .product-card { border-radius: 4px; }

    .dynamic-number {
        font-size: clamp(17px, 5.7vw, 25px);
    }

    .value-strip {
        margin-top: 24px;
        padding: 13px 8px;
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 12px 0;
    }

    .value-item {
        grid-template-columns: 36px 1fr;
        gap: 8px;
        padding: 2px 8px;
    }

    .value-item:nth-child(2) { border-right: 0; }

    .value-icon {
        width: 33px;
        height: 33px;
        font-size: 14px;
    }

    .value-title {
        font-size: 8px;
        letter-spacing: .8px;
    }

    .value-copy {
        font-size: 7px;
    }
}
</style>
</head>

<body>
<div class="product-page">

<nav class="inner-nav">
    <a href="../index.html" id="navHome" data-nav-sound="home"></a>
    <a href="../discover/" id="navDiscover" data-nav-sound="discover"></a>
    <a href="../explore/" id="navExplore" data-nav-sound="explore"></a>
</nav>

<main class="product-content">

<section class="product-intro">
    <div class="brand-label">VotZet</div>
    <h1 class="product-title" id="categoryTitle">Men — Health</h1>
    <p class="product-subtitle" id="categorySubtitle">
        21 selected solutions for everyday health and wellness.
    </p>
    <div class="title-line"></div>
</section>

<section class="products-grid" id="productsGrid" aria-label="Products"></section>

<section class="value-strip" aria-label="VotZet values">
    <div class="value-item">
        <div class="value-icon">◇</div>
        <div>
            <div class="value-title">Quality</div>
            <div class="value-copy">Carefully selected for your well-being</div>
        </div>
    </div>

    <div class="value-item">
        <div class="value-icon">♢</div>
        <div>
            <div class="value-title">Premium</div>
            <div class="value-copy">Products that deliver real results</div>
        </div>
    </div>

    <div class="value-item">
        <div class="value-icon">◌</div>
        <div>
            <div class="value-title">Wellness</div>
            <div class="value-copy">Support for body, mind and lifestyle</div>
        </div>
    </div>

    <div class="value-item">
        <div class="value-icon">♕</div>
        <div>
            <div class="value-title">Trust</div>
            <div class="value-copy">Reliable solutions you can depend on</div>
        </div>
    </div>
</section>

<div class="bottom-actions">
    <a class="back-explore" href="../explore/" data-nav-sound="explore">
        ← Back to Explore
    </a>
</div>

</main>
</div>

<script src="../js/main.js"></script>
<script src="../js/language.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const params = new URLSearchParams(window.location.search);
    const world = params.get("world") || "men";
    const need = params.get("need") || "health";

    const dataPath = `../data/products/${world}/${need}.json`;
    const placeholderPath = "../assets/images/product-placeholder.webp";

    async function loadCommon() {
        const language =
            localStorage.getItem("votzet-language") || "en";

        try {
            const response =
                await fetch(`../locales/${language}/common.json`);

            if (!response.ok) return;

            const common = await response.json();

            document.getElementById("navHome").textContent =
                common.home || "Home";

            document.getElementById("navDiscover").textContent =
                common.discover || "Discover";

            document.getElementById("navExplore").textContent =
                common.explore || "Explore";
        }
        catch (error) {
            console.warn("VotZet Product Grid localization:", error);
        }
    }

    function createPlaceholderCard(product) {
        const card = document.createElement("article");
        card.className = "product-card";

        const image = document.createElement("img");
        image.className = "placeholder-image";
        image.src = placeholderPath;
        image.alt = "";
        image.loading = "lazy";

        const mask = document.createElement("div");
        mask.className = "dynamic-number-mask";

        const number = document.createElement("div");
        number.className = "dynamic-number";
        number.textContent =
            String(product.slot).padStart(2, "0");

        mask.appendChild(number);
        card.appendChild(image);
        card.appendChild(mask);

        return card;
    }

    function createActiveCard(product) {
        const card = document.createElement("a");
        card.className = "product-card active";
        card.href = product.url || "#";

        const image = document.createElement("img");
        image.className = "product-image";
        image.src = product.image || placeholderPath;
        image.alt = product.title || "";
        image.loading = "lazy";

        const overlay = document.createElement("div");
        overlay.className = "active-overlay";

        const name = document.createElement("h2");
        name.className = "active-name";
        name.textContent = product.title || "";

        const price = document.createElement("div");
        price.className = "active-price";

        if (product.price) {
            price.textContent =
                `${product.price} ${product.currency || ""}`.trim();
        }

        overlay.appendChild(name);
        overlay.appendChild(price);

        card.appendChild(image);
        card.appendChild(overlay);

        return card;
    }

    function createCard(product) {
        return product.status === "active"
            ? createActiveCard(product)
            : createPlaceholderCard(product);
    }

    await loadCommon();

    try {
        const response = await fetch(dataPath);

        if (!response.ok) {
            throw new Error(`Product data unavailable: ${dataPath}`);
        }

        const data = await response.json();

        document.getElementById("categoryTitle").textContent =
            data.title || "VotZet";

        document.getElementById("categorySubtitle").textContent =
            data.subtitle || "";

        const grid = document.getElementById("productsGrid");
        grid.innerHTML = "";

        const products =
            Array.isArray(data.products) ? data.products : [];

        for (let slot = 1; slot <= 21; slot++) {
            const existing =
                products.find(product => Number(product.slot) === slot);

            const product =
                existing || {
                    slot,
                    status: "placeholder",
                    title: "",
                    price: "",
                    currency: "USD",
                    image: "",
                    url: ""
                };

            grid.appendChild(createCard(product));
        }
    }
    catch (error) {
        console.error("VotZet Product Grid:", error);
    }
});
</script>

</body>
</html>
