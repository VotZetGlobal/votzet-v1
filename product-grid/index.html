<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Men — Health — VotZet</title>
<meta name="description" content="Selected VotZet solutions for Men — Health.">
<link rel="stylesheet" href="../css/main.css">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    margin: 0;
    background: #101113;
    color: #f2f2ef;
    overflow-x: hidden;
    overflow-y: auto;
}

.product-page {
    min-height: 100dvh;
    min-height: 100svh;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(201,162,39,0.045),
            transparent 40%
        ),
        #101113;
}

/* NAVIGATION */
.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 17px 12px;
    background: rgba(8,9,10,0.94);
    border-bottom: 1px solid rgba(201,162,39,0.18);
    backdrop-filter: blur(12px);
}

.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.inner-nav a:hover {
    color: #e4c44f;
}

/* INTRO */
.product-content {
    width: 100%;
    padding: 52px 14px max(60px, env(safe-area-inset-bottom));
}

.product-intro {
    max-width: 1180px;
    margin: 0 auto;
    text-align: center;
}

.brand-label {
    margin-bottom: 16px;
    color: #d8b83d;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.product-title {
    margin: 0;
    color: #f2f2ef;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: 1px;
}

.product-subtitle {
    max-width: 720px;
    margin: 15px auto 0;
    color: #85868a;
    font-size: 13px;
    line-height: 1.6;
}

/* GRID: DESKTOP = 7 COLUMNS × 3 ROWS */
.products-grid {
    width: 100%;
    max-width: 1380px;
    margin: 40px auto 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 10px;
}

/* CARD */
.product-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.012);
    color: inherit;
    text-decoration: none;
    transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
}

.product-card.active {
    cursor: pointer;
}

.product-card.active:hover {
    transform: translateY(-3px);
    border-color: rgba(201,162,39,0.65);
    background: rgba(201,162,39,0.035);
    box-shadow: 0 10px 30px rgba(0,0,0,0.24);
}

.product-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background:
        linear-gradient(
            145deg,
            rgba(201,162,39,0.045),
            rgba(255,255,255,0.010)
        );
}

.product-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

/* FIRM VOTZET PLACEHOLDER
   Rendered by code, so no separate image file is required. */
.product-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
    text-align: center;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(201,162,39,0.10),
            transparent 42%
        ),
        linear-gradient(
            145deg,
            rgba(12,13,15,0.94),
            rgba(19,20,22,0.98)
        );
}

.placeholder-mark {
    width: 42px;
    height: 42px;
    margin-bottom: 12px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(201,162,39,0.46);
    transform: rotate(45deg);
}

.placeholder-mark span {
    color: #d8b83d;
    font-size: 11px;
    letter-spacing: 1px;
    transform: rotate(-45deg);
}

.placeholder-brand {
    color: #d8b83d;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.placeholder-status {
    margin-top: 7px;
    color: #77787c;
    font-size: 9px;
    line-height: 1.35;
}

/* CARD INFO */
.product-info {
    min-height: 92px;
    padding: 10px 9px 11px;
    display: flex;
    flex-direction: column;
}

.product-slot {
    margin-bottom: 6px;
    color: #9e8428;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.product-name {
    margin: 0;
    color: #deded9;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.35;
}

.product-short {
    margin: 6px 0 0;
    color: #707176;
    font-size: 9px;
    line-height: 1.35;
}

.product-price {
    margin-top: auto;
    padding-top: 8px;
    color: #d8b83d;
    font-size: 10px;
}

/* BACK */
.bottom-actions {
    margin-top: 42px;
    text-align: center;
}

.back-explore {
    display: inline-block;
    padding: 11px 25px;
    border: 1px solid rgba(201,162,39,0.75);
    border-radius: 28px;
    color: #d8b83d;
    text-decoration: none;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.back-explore:hover {
    background: #d8b83d;
    color: #101113;
}

/* MOBILE = 3 COLUMNS × 7 ROWS */
@media (max-width: 650px) {

    .inner-nav {
        gap: 20px;
        padding: 16px 12px;
    }

    .inner-nav a {
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    .product-content {
        padding:
            40px 7px
            max(42px, env(safe-area-inset-bottom));
    }

    .product-title {
        font-size: 30px;
    }

    .product-subtitle {
        padding: 0 10px;
    }

    .products-grid {
        margin-top: 30px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
    }

    .product-info {
        min-height: 80px;
        padding: 7px 6px 8px;
    }

    .product-name {
        font-size: 10px;
    }

    .product-short {
        display: none;
    }

    .product-price {
        font-size: 9px;
    }

    .placeholder-mark {
        width: 34px;
        height: 34px;
        margin-bottom: 9px;
    }

    .placeholder-mark span {
        font-size: 9px;
    }

    .placeholder-brand {
        font-size: 8px;
        letter-spacing: 2px;
    }

    .placeholder-status {
        font-size: 8px;
    }
}

@media (max-width: 380px) {
    .inner-nav {
        gap: 16px;
    }

    .inner-nav a {
        font-size: 8px;
        letter-spacing: 1.3px;
    }

    .products-grid {
        gap: 5px;
    }
}
</style>
</head>

<body>

<div class="product-page">

<nav class="inner-nav">
    <a href="../index.html" id="navHome" data-nav-sound="home"></a>
    <a href="../discover/" id="navDiscover" data-nav-sound="discover"></a>
    <a href="../explore/" id="navExplore" data-nav-sound="explore"></a>
</nav>

<main class="product-content">

    <section class="product-intro">
        <div class="brand-label">VotZet</div>

        <h1 class="product-title" id="categoryTitle">
            Men — Health
        </h1>

        <p class="product-subtitle" id="categorySubtitle">
            21 selected solutions for everyday health and wellness.
        </p>
    </section>

    <section
        class="products-grid"
        id="productsGrid"
        aria-label="Products"
    ></section>

    <div class="bottom-actions">
        <a
            class="back-explore"
            href="../explore/"
            data-nav-sound="explore"
        >
            ← Back to Explore
        </a>
    </div>

</main>
</div>

<script src="../js/main.js"></script>
<script src="../js/language.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const world =
        params.get("world") || "men";

    const need =
        params.get("need") || "health";

    const dataPath =
        `../data/products/${world}/${need}.json`;

    async function loadCommon() {

        const language =
            localStorage.getItem(
                "votzet-language"
            ) || "en";

        try {
            const response =
                await fetch(
                    `../locales/${language}/common.json`
                );

            if (!response.ok) {
                return;
            }

            const common =
                await response.json();

            document.getElementById("navHome").textContent =
                common.home || "Home";

            document.getElementById("navDiscover").textContent =
                common.discover || "Discover";

            document.getElementById("navExplore").textContent =
                common.explore || "Explore";

        } catch (error) {
            console.warn(
                "VotZet product-grid localization:",
                error
            );
        }
    }

    function createPlaceholder() {

        const placeholder =
            document.createElement(
                "div"
            );

        placeholder.className =
            "product-placeholder";

        placeholder.innerHTML = `
            <div class="placeholder-mark">
                <span>VZ</span>
            </div>

            <div class="placeholder-brand">
                VotZet
            </div>

            <div class="placeholder-status">
                Selection in progress
            </div>
        `;

        return placeholder;
    }

    function createCard(product) {

        const isActive =
            product.status === "active";

        const card =
            document.createElement(
                isActive
                    ? "a"
                    : "article"
            );

        card.className =
            "product-card";

        if (isActive) {
            card.classList.add(
                "active"
            );

            card.href =
                product.url || "#";
        }

        const imageWrap =
            document.createElement(
                "div"
            );

        imageWrap.className =
            "product-image-wrap";

        if (
            isActive &&
            product.image
        ) {

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "product-image";

            image.src =
                product.image;

            image.alt =
                product.title || "";

            image.loading =
                "lazy";

            imageWrap.appendChild(
                image
            );

        } else {

            imageWrap.appendChild(
                createPlaceholder()
            );
        }

        const info =
            document.createElement(
                "div"
            );

        info.className =
            "product-info";

        const slot =
            document.createElement(
                "div"
            );

        slot.className =
            "product-slot";

        slot.textContent =
            String(product.slot)
                .padStart(2, "0");

        const title =
            document.createElement(
                "h2"
            );

        title.className =
            "product-name";

        title.textContent =
            product.title ||
            "Selection in progress";

        const short =
            document.createElement(
                "p"
            );

        short.className =
            "product-short";

        short.textContent =
            product.short || "";

        const price =
            document.createElement(
                "div"
            );

        price.className =
            "product-price";

        if (
            isActive &&
            product.price
        ) {
            price.textContent =
                `${product.price} ${product.currency || ""}`
                    .trim();
        } else {
            price.textContent =
                "VotZet Selection";
        }

        info.appendChild(slot);
        info.appendChild(title);
        info.appendChild(short);
        info.appendChild(price);

        card.appendChild(imageWrap);
        card.appendChild(info);

        return card;
    }

    await loadCommon();

    try {

        const response =
            await fetch(
                dataPath
            );

        if (!response.ok) {
            throw new Error(
                `Product data unavailable: ${dataPath}`
            );
        }

        const data =
            await response.json();

        document.getElementById(
            "categoryTitle"
        ).textContent =
            data.title ||
            "VotZet";

        document.getElementById(
            "categorySubtitle"
        ).textContent =
            data.subtitle || "";

        const grid =
            document.getElementById(
                "productsGrid"
            );

        grid.innerHTML =
            "";

        const products =
            Array.isArray(
                data.products
            )
                ? data.products
                : [];

        for (
            let slot = 1;
            slot <= 21;
            slot++
        ) {

            const existing =
                products.find(
                    product =>
                        Number(
                            product.slot
                        ) === slot
                );

            const product =
                existing || {
                    slot,
                    status:
                        "placeholder",
                    title:
                        "Selection in progress",
                    short:
                        "We’re selecting the right product for this place.",
                    price:
                        "",
                    currency:
                        "USD",
                    image:
                        "",
                    url:
                        ""
                };

            grid.appendChild(
                createCard(
                    product
                )
            );
        }

    } catch (error) {
        console.error(
            "VotZet Product Grid:",
            error
        );
    }

});
</script>

</body>
</html>
