<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Men — Health — VotZet</title>
<meta name="description" content="Selected VotZet solutions for Men — Health.">
<link rel="stylesheet" href="../css/main.css">
<style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#0d0e10;color:#f2f2ef;overflow-x:hidden;overflow-y:auto}.product-page{min-height:100dvh;min-height:100svh;background:radial-gradient(circle at 50% 8%,rgba(201,162,39,.045),transparent 32%),linear-gradient(to bottom,#101113,#0c0d0f)}
.inner-nav{position:sticky;top:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:28px;padding:17px 12px;background:rgba(8,9,10,.94);border-bottom:1px solid rgba(201,162,39,.18);backdrop-filter:blur(12px)}.inner-nav a{color:#f2f2ef;text-decoration:none;font-size:9px;font-weight:400;letter-spacing:2px;text-transform:uppercase}.inner-nav a:hover{color:#e4c44f}
.product-content{width:100%;padding:52px 16px max(60px,env(safe-area-inset-bottom))}.product-intro{width:100%;max-width:1180px;margin:0 auto;text-align:center}.brand-label{margin-bottom:16px;color:#d8b83d;font-size:10px;font-weight:400;letter-spacing:5px;text-transform:uppercase}.product-title{margin:0;color:#f2f2ef;font-size:40px;font-weight:400;line-height:1.1;letter-spacing:1px}.title-line{width:72px;height:1px;margin:22px auto 0;background:rgba(201,162,39,.72);box-shadow:0 0 14px rgba(201,162,39,.16)}.product-subtitle{max-width:720px;margin:18px auto 0;color:#929397;font-size:13px;line-height:1.6}
.products-grid{width:100%;max-width:1380px;margin:42px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.product-card{position:relative;min-width:0;overflow:hidden;border:1px solid rgba(201,162,39,.34);border-radius:4px;background:linear-gradient(180deg,rgba(15,16,18,.98),rgba(10,11,13,.99));color:inherit;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.006);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.product-card.active{cursor:pointer}.product-card.active:hover{transform:translateY(-3px);border-color:rgba(228,196,79,.78);box-shadow:0 10px 30px rgba(0,0,0,.26),0 0 22px rgba(201,162,39,.07)}
.product-visual{position:relative;width:100%;aspect-ratio:.78/1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px 10px;text-align:center}.product-visual::before,.product-visual::after{content:"";position:absolute;top:31%;width:48%;height:54px;opacity:.55;background:repeating-radial-gradient(ellipse at center,rgba(201,162,39,.52) 0 1px,transparent 1px 5px);filter:blur(.2px);transform:scaleY(.34)}.product-visual::before{left:-4%;transform-origin:right center}.product-visual::after{right:-4%;transform-origin:left center}.product-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.placeholder-logo{position:relative;z-index:2;width:66px;height:66px;display:grid;place-items:center;margin-bottom:18px;border:1px solid rgba(201,162,39,.62);border-radius:50%;background:radial-gradient(circle at 42% 35%,rgba(255,235,170,.09),rgba(12,13,15,.92) 55%);box-shadow:0 0 18px rgba(201,162,39,.08)}.placeholder-logo span{color:#e2bd49;font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:700;line-height:1;letter-spacing:-3px;text-shadow:0 0 10px rgba(201,162,39,.18)}.placeholder-state{position:relative;z-index:2;color:#ededE9;font-size:10px;line-height:1.3;letter-spacing:1.8px;text-transform:uppercase}.placeholder-state strong{display:block;margin-top:3px;color:#d8b83d;font-size:9px;font-weight:400;letter-spacing:1.7px}.placeholder-divider{position:relative;z-index:2;width:34px;height:1px;margin:14px auto 10px;background:rgba(201,162,39,.62)}.product-slot{position:relative;z-index:2;color:#d8b83d;font-size:24px;font-weight:300;line-height:1;letter-spacing:1px}.placeholder-badge{position:relative;z-index:2;width:calc(100% - 12px);margin-top:16px;padding:6px 5px 5px;border:1px solid rgba(201,162,39,.72);border-radius:3px;color:#d8b83d;font-size:7px;line-height:1.2;letter-spacing:1.1px;text-transform:uppercase}
.active-overlay{position:absolute;inset:auto 0 0 0;z-index:3;padding:12px 10px 11px;background:linear-gradient(to top,rgba(5,6,7,.96),rgba(5,6,7,.74),transparent);text-align:center}.active-name{margin:0;color:#f0f0ed;font-size:11px;font-weight:400;line-height:1.35}.active-price{margin-top:7px;color:#d8b83d;font-size:10px}
.bottom-actions{margin-top:42px;text-align:center}.back-explore{display:inline-block;padding:11px 25px;border:1px solid rgba(201,162,39,.75);border-radius:28px;color:#d8b83d;text-decoration:none;font-size:9px;letter-spacing:2.5px;text-transform:uppercase}.back-explore:hover{background:#d8b83d;color:#101113}
@media(max-width:650px){.inner-nav{gap:20px;padding:16px 12px}.inner-nav a{font-size:9px;letter-spacing:1.5px}.product-content{padding:40px 7px max(42px,env(safe-area-inset-bottom))}.product-title{font-size:30px}.product-subtitle{padding:0 10px;font-size:12px}.products-grid{margin-top:30px;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.product-visual{aspect-ratio:.72/1;padding:10px 5px 7px}.placeholder-logo{width:48px;height:48px;margin-bottom:12px}.placeholder-logo span{font-size:21px;letter-spacing:-2px}.placeholder-state{font-size:8px;letter-spacing:1.2px}.placeholder-state strong{font-size:7px;letter-spacing:1.1px}.placeholder-divider{width:27px;margin:10px auto 8px}.product-slot{font-size:19px}.placeholder-badge{width:calc(100% - 8px);margin-top:11px;padding:5px 2px 4px;font-size:6px;letter-spacing:.75px}.product-visual::before,.product-visual::after{top:30%;height:38px}.active-name{font-size:9px}.active-price{font-size:9px}}
@media(max-width:380px){.inner-nav{gap:16px}.inner-nav a{font-size:8px;letter-spacing:1.3px}.products-grid{gap:5px}.placeholder-logo{width:43px;height:43px}.placeholder-logo span{font-size:19px}.placeholder-state{font-size:7px}.placeholder-state strong{font-size:6.5px}.placeholder-badge{font-size:5.5px}}
</style>
</head>
<body>
<div class="product-page">
<nav class="inner-nav">
<a href="../index.html" id="navHome" data-nav-sound="home"></a>
<a href="../discover/" id="navDiscover" data-nav-sound="discover"></a>
<a href="../explore/" id="navExplore" data-nav-sound="explore"></a>
</nav>
<main class="product-content">
<section class="product-intro">
<div class="brand-label">VotZet</div>
<h1 class="product-title" id="categoryTitle">Men — Health</h1>
<div class="title-line"></div>
<p class="product-subtitle" id="categorySubtitle">21 selected solutions for everyday health and wellness.</p>
</section>
<section class="products-grid" id="productsGrid" aria-label="Products"></section>
<div class="bottom-actions"><a class="back-explore" href="../explore/" data-nav-sound="explore">← Back to Explore</a></div>
</main>
</div>
<script src="../js/main.js"></script>
<script src="../js/language.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
const params=new URLSearchParams(window.location.search);const world=params.get("world")||"men";const need=params.get("need")||"health";const dataPath=`../data/products/${world}/${need}.json`;
async function loadCommon(){const language=localStorage.getItem("votzet-language")||"en";try{const response=await fetch(`../locales/${language}/common.json`);if(!response.ok)return;const common=await response.json();document.getElementById("navHome").textContent=common.home||"Home";document.getElementById("navDiscover").textContent=common.discover||"Discover";document.getElementById("navExplore").textContent=common.explore||"Explore"}catch(error){console.warn("VotZet Product Grid localization:",error)}}
function createPlaceholderCard(product){const card=document.createElement("article");card.className="product-card";const visual=document.createElement("div");visual.className="product-visual";const logo=document.createElement("div");logo.className="placeholder-logo";const logoText=document.createElement("span");logoText.textContent="VZ";logo.appendChild(logoText);const state=document.createElement("div");state.className="placeholder-state";state.innerHTML=`Selection<strong>In progress</strong>`;const divider=document.createElement("div");divider.className="placeholder-divider";const slot=document.createElement("div");slot.className="product-slot";slot.textContent=String(product.slot).padStart(2,"0");const badge=document.createElement("div");badge.className="placeholder-badge";badge.textContent="VotZet Selection";visual.appendChild(logo);visual.appendChild(state);visual.appendChild(divider);visual.appendChild(slot);visual.appendChild(badge);card.appendChild(visual);return card}
function createActiveCard(product){const card=document.createElement("a");card.className="product-card active";card.href=product.url||"#";const visual=document.createElement("div");visual.className="product-visual";if(product.image){const image=document.createElement("img");image.className="product-image";image.src=product.image;image.alt=product.title||"";image.loading="lazy";visual.appendChild(image)}const overlay=document.createElement("div");overlay.className="active-overlay";const name=document.createElement("h2");name.className="active-name";name.textContent=product.title||"";const price=document.createElement("div");price.className="active-price";if(product.price){price.textContent=`${product.price} ${product.currency||""}`.trim()}overlay.appendChild(name);overlay.appendChild(price);visual.appendChild(overlay);card.appendChild(visual);return card}
function createCard(product){return product.status==="active"?createActiveCard(product):createPlaceholderCard(product)}
await loadCommon();try{const response=await fetch(dataPath);if(!response.ok)throw new Error(`Product data unavailable: ${dataPath}`);const data=await response.json();document.getElementById("categoryTitle").textContent=data.title||"VotZet";document.getElementById("categorySubtitle").textContent=data.subtitle||"";const grid=document.getElementById("productsGrid");grid.innerHTML="";const products=Array.isArray(data.products)?data.products:[];for(let slot=1;slot<=21;slot++){const existing=products.find(product=>Number(product.slot)===slot);const product=existing||{slot,status:"placeholder",title:"",short:"",price:"",currency:"USD",image:"",url:""};grid.appendChild(createCard(product))}}catch(error){console.error("VotZet Product Grid:",error)}});
</script>
</body>
</html>
