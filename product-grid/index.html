<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Men — Health — VotZet</title>

<meta
    name="description"
    content="Selected VotZet solutions for Men — Health."
>

<link rel="stylesheet" href="../css/main.css">

<!-- Start loading the shared placeholder graphic immediately. -->
<link
    rel="preload"
    as="image"
    href="../assets/images/product-placeholder-vz.webp"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
}

body {
    margin: 0;
    overflow-x: hidden;
    overflow-y: auto;

    background: #0b0c0e;
    color: #f2f2ef;
}

/* =========================================================
   INITIAL RENDER
   Nothing on the Product Grid is shown until:
   interface localization + category localization +
   product data + placeholder graphic are ready.
   This removes the English flash and partial loading.
   ========================================================= */

.product-page {
    opacity: 0;
    visibility: hidden;
}

.product-page.product-grid-ready {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.14s ease;
}

.product-page {
    min-height: 100svh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(232,198,74,0.05),
            transparent 36%
        ),
        #0b0c0e;
}


/* =========================================================
   PRODUCT PAGE BACKGROUND
   Slightly lighter than the other inner pages so the
   hexagonal VotZet texture remains visible between cards.
   ========================================================= */

.product-page.votzet-inner-surface {
    background:
        linear-gradient(
            rgba(7,8,9,0.56),
            rgba(7,8,9,0.66)
        ),
        url("../assets/images/votzet-inner-bg.jpg")
        center center / cover fixed no-repeat !important;
}

.product-page.votzet-inner-surface::before {
    background:
        radial-gradient(
            circle at 50% 22%,
            rgba(232,198,74,0.045),
            transparent 34%
        ),
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.01),
            rgba(0,0,0,0.10)
        );
}

/* =========================================================
   NAVIGATION
   ========================================================= */

.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 28px;

    padding: 17px 12px;

    background: rgba(8,9,10,0.94);

    border-bottom:
        1px solid rgba(232,198,74,0.18);

    backdrop-filter: blur(12px);
}

.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 2px;
    text-transform: uppercase;
}

.inner-nav a:hover {
    color: #e4c44f;
}


/* =========================================================
   INTRO
   ========================================================= */

.product-content {
    width: 100%;

    padding:
        50px 16px
        max(55px, env(safe-area-inset-bottom));
}

.product-intro {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    text-align: center;
}

.brand-label {
    margin-bottom: 15px;

    color: #f0cf58;

    font-size: 10px;

    letter-spacing: 5px;
    text-transform: uppercase;
}

.product-title {
    margin: 0;

    color: #f2f2ef;

    font-size: 40px;
    font-weight: 400;

    line-height: 1.1;
    letter-spacing: 1px;
}

.product-subtitle {
    max-width: 720px;

    margin: 17px auto 0;

    color: #96979b;

    font-size: 13px;
    line-height: 1.6;
}

.title-line {
    width: 70px;
    height: 1px;

    margin: 21px auto 0;

    background: #f0cf58;

    box-shadow:
        0 0 10px rgba(216,184,61,0.45);
}


/* =========================================================
   GRID
   DESKTOP = 7 × 3
   ========================================================= */

.products-grid {
    width: 100%;
    max-width: 1460px;

    margin: 38px auto 0;

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    gap: 14px;
}


/* =========================================================
   CARD
   ========================================================= */

.product-card {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    border:
        1px solid rgba(232,198,74,0.50);

    border-radius: 8px;

    background:
        linear-gradient(
            180deg,
            rgba(10,11,12,0.99),
            rgba(5,6,7,1)
        );

    color: inherit;
    text-decoration: none;

    box-shadow:
        inset 0 0 20px rgba(232,198,74,0.018);

    transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
}

.product-card.active {
    cursor: pointer;
}

.product-card.active:hover {
    transform: translateY(-3px);

    border-color:
        rgba(243,216,103,0.82);

    box-shadow:
        0 10px 28px rgba(0,0,0,0.30),
        0 0 18px rgba(232,198,74,0.07);
}


/* =========================================================
   PLACEHOLDER
   ========================================================= */

.placeholder-card-inner {
    width: 100%;
    height: 100%;

    min-height: 360px;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        14px 10px 12px;

    text-align: center;
}


/* VZ + GOLD WAVE */

.placeholder-vz-wrap {
    width: 100%;

    aspect-ratio: 1536 / 810;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    margin-bottom: 18px;
}

.placeholder-vz {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
    object-position: center;
}


/* SELECTION / IN PROGRESS */

.placeholder-state {
    color: #f0f0ed;

    font-size: 10px;
    line-height: 1.25;

    letter-spacing: 1.8px;
    text-transform: uppercase;
}

.placeholder-state strong {
    display: block;

    margin-top: 4px;

    color: #f0cf58;

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 1.7px;
}


/* GOLD DIVIDER */

.placeholder-divider {
    width: 38px;
    height: 1px;

    margin: 15px auto 12px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e2b83a,
            transparent
        );

    box-shadow:
        0 0 8px rgba(226,184,58,0.30);
}


/* PRODUCT NUMBER */

.product-slot {
    color: #dcae32;

    font-size: 30px;
    font-weight: 300;

    line-height: 1;

    letter-spacing: 1px;
}


/* VOTZET SELECTION */

.placeholder-badge {
    width: calc(100% - 8px);

    margin-top: 18px;

    padding: 7px 6px 6px;

    border:
        1px solid rgba(222,178,49,0.84);

    border-radius: 5px;

    color: #f0cf58;

    font-size: 7px;

    letter-spacing: 1.15px;
    text-transform: uppercase;
}


/* =========================================================
   ACTIVE PRODUCT
   ========================================================= */

.active-product-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 0.72 / 1;

    overflow: hidden;
}

.product-image {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.active-overlay {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        34% 9px 11px;

    background:
        linear-gradient(
            to top,
            rgba(5,6,7,0.98),
            rgba(5,6,7,0.72),
            transparent
        );

    text-align: center;
}

.active-name {
    margin: 0;

    color: #f0f0ed;

    font-size: 11px;
    font-weight: 400;

    line-height: 1.35;
}

.active-price {
    margin-top: 7px;

    color: #f0cf58;

    font-size: 10px;
}


/* =========================================================
   VALUE STRIP
   ========================================================= */

.value-strip {
    width: 100%;
    max-width: 1180px;

    margin: 34px auto 0;
    padding: 18px 20px;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    border:
        1px solid rgba(243,216,103,0.68);

    border-radius: 8px;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(232,198,74,0.065),
            transparent 66%
        ),
        rgba(8,9,10,0.90);

    box-shadow:
        0 0 26px rgba(232,198,74,0.10),
        inset 0 0 20px rgba(232,198,74,0.035);
}

.value-item {
    min-width: 0;

    display: grid;

    grid-template-columns:
        48px 1fr;

    align-items: center;

    gap: 12px;
    padding: 3px 17px;

    border-right:
        1px solid rgba(232,198,74,0.22);
}

.value-item:last-child {
    border-right: 0;
}

.value-icon {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border:
        1px solid #f0cf58;

    border-radius: 50%;

    color: #f5d866;

    font-size: 19px;

    box-shadow:
        0 0 18px rgba(243,216,103,0.42),
        inset 0 0 12px rgba(243,216,103,0.10);
}

.value-title {
    color: #ffffff;

    font-size: 11.5px;
    font-weight: 500;

    letter-spacing: 1.3px;
    text-transform: uppercase;
}

.value-copy {
    margin-top: 5px;

    color: #c7c9cc;

    font-size: 10.5px;

    line-height: 1.5;
}


/* =========================================================
   BACK
   ========================================================= */

.bottom-actions {
    margin-top: 38px;

    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
}

.back-explore {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 210px;

    padding: 11px 25px;

    border:
        1px solid rgba(232,198,74,0.75);

    border-radius: 28px;

    color: #f0cf58;

    text-decoration: none;

    font-size: 9px;

    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.back-explore:hover {
    background: #f0cf58;

    color: #101113;
}

.back-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    font-size: 27px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0;
    vertical-align: middle;
    transform: translateY(-1px);
}


/* =========================================================
   MOBILE = 3 × 7
   ========================================================= */

@media (max-width: 650px) {

    .bottom-actions {
        flex-direction: column;
        gap: 12px;
    }

    .back-explore {
        width: min(86vw, 320px);
        min-width: 0;
        box-sizing: border-box;
    }

    .inner-nav {
        gap: 20px;

        padding: 16px 12px;
    }

    .inner-nav a {
        font-size: 9px;

        letter-spacing: 1.5px;
    }

    .product-content {
        padding:
            39px 6px
            max(42px, env(safe-area-inset-bottom));
    }

    .product-title {
        font-size: 30px;
    }

    .product-subtitle {
        padding: 0 9px;

        font-size: 12px;
    }

    .products-grid {
        margin-top: 29px;

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 8px;
    }

    .product-card {
        border-radius: 5px;
    }

    .placeholder-card-inner {
        min-height: 0;

        aspect-ratio: 0.66 / 1;

        padding:
            7px 5px 6px;
    }

    .placeholder-vz-wrap {
        margin-bottom: 8px;
    }

    .placeholder-state {
        font-size: 7.2px;

        letter-spacing: 1px;
    }

    .placeholder-state strong {
        margin-top: 2px;

        font-size: 6.5px;

        letter-spacing: 0.9px;
    }

    .placeholder-divider {
        width: 28px;

        margin:
            8px auto 7px;
    }

    .product-slot {
        font-size: 20px;
    }

    .placeholder-badge {
        width: calc(100% - 4px);

        margin-top: 12px;

        padding: 5px 2px 4px;

        font-size: 5.5px;

        letter-spacing: 0.62px;
    }

    .value-strip {
        margin-top: 24px;

        padding: 13px 8px;

        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 12px 0;
    }

    .value-item {
        grid-template-columns:
            36px 1fr;

        gap: 8px;

        padding: 2px 8px;
    }

    .value-item:nth-child(2) {
        border-right: 0;
    }

    .value-icon {
        width: 33px;
        height: 33px;

        font-size: 14px;
    }

    .value-title {
        font-size: 9.5px;

        letter-spacing: 0.8px;
    }

    .value-copy {
        font-size: 9px;
        line-height: 1.45;
    }
}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .inner-nav {
        gap: 16px;
    }

    .inner-nav a {
        font-size: 8px;

        letter-spacing: 1.3px;
    }

    .products-grid {
        gap: 7px;
    }

    .placeholder-state {
        font-size: 6.6px;
    }

    .placeholder-state strong {
        font-size: 6px;
    }

    .placeholder-badge {
        font-size: 5px;
    }
}

</style>
</head>


<body>

<div class="product-page votzet-inner-surface">


<!-- =======================================================
     NAVIGATION
     ======================================================= -->

<nav class="inner-nav">

    <a
        href="../index.html"
        id="navHome"
        data-nav-sound="home"
    ></a>

    <a
        href="../discover/"
        id="navDiscover"
        data-nav-sound="discover"
    ></a>

    <a
        href="../explore/"
        id="navExplore"
        data-nav-sound="explore"
    ></a>

</nav>


<main class="product-content">


<!-- =======================================================
     CATEGORY INTRO
     ======================================================= -->

<section class="product-intro">

    <div class="brand-label">
        VotZet
    </div>

    <h1
        class="product-title"
        id="categoryTitle"
    ></h1>

    <p
        class="product-subtitle"
        id="categorySubtitle"
    ></p>

    <div class="title-line"></div>

</section>


<!-- =======================================================
     PRODUCT GRID
     ======================================================= -->

<section
    class="products-grid"
    id="productsGrid"
    aria-label="Products"
></section>


<!-- =======================================================
     VOTZET VALUES
     ======================================================= -->

<section
    class="value-strip"
    aria-label="VotZet values"
>

    <div class="value-item">

        <div class="value-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 12.5l3.2 3.2 7.8-8"/>
            </svg>
        </div>

        <div>

            <div class="value-title" id="valueQualityTitle"></div>

            <div class="value-copy" id="valueQualityCopy"></div>

        </div>

    </div>


    <div class="value-item">

        <div class="value-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l6 7-6 11-6-11 6-7z"/>
                <path d="M6 10h12"/>
            </svg>
        </div>

        <div>

            <div class="value-title" id="valuePremiumTitle"></div>

            <div class="value-copy" id="valuePremiumCopy"></div>

        </div>

    </div>


    <div class="value-item">

        <div class="value-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 5c-7 .2-11 3.4-11 8.4 0 3 2 5.1 4.8 5.1C17.1 18.5 19 13.6 19 5z"/>
                <path d="M5 20c2.3-4.8 5.7-8.1 10.5-10.2"/>
            </svg>
        </div>

        <div>

            <div class="value-title" id="valueWellnessTitle"></div>

            <div class="value-copy" id="valueWellnessCopy"></div>

        </div>

    </div>


    <div class="value-item">

        <div class="value-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l7 3v5c0 4.8-2.8 8.2-7 10-4.2-1.8-7-5.2-7-10V6l7-3z"/>
                <path d="M8.5 12l2.2 2.2 4.8-5"/>
            </svg>
        </div>

        <div>

            <div class="value-title" id="valueTrustTitle"></div>

            <div class="value-copy" id="valueTrustCopy"></div>

        </div>

    </div>

</section>


<!-- =======================================================
     BACK NAVIGATION
     Desktop: two buttons side by side
     Mobile: two buttons stacked vertically
     ======================================================= -->

<div class="bottom-actions">

    <a
        class="back-explore"
        id="backNeeds"
        href="../explore/"
        data-nav-sound="explore"
    ></a>

    <a
        class="back-explore"
        id="backWorlds"
        href="../explore/"
        data-nav-sound="explore"
    ></a>

</div>


</main>
</div>


<script src="../js/main.js"></script>
<script src="../js/language.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const page =
            document.querySelector(
                ".product-page"
            );

        const params =
            new URLSearchParams(
                window.location.search
            );

        const world =
            params.get("world") ||
            "men";

        const need =
            params.get("need") ||
            "health";

        const language =
            localStorage.getItem(
                "votzet-language"
            ) || "en";

        const dataPath =
            `../data/products/${world}/${need}.json`;

        const interfacePath =
            `../locales/${language}/product-grid.json`;

        const productLocalePath =
            `../locales/${language}/products/${world}-${need}.json`;

        const exploreLocalePath =
            `../locales/${language}/explore.json`;

        const placeholderGraphic =
            "../assets/images/product-placeholder-vz.webp";

        document.documentElement.lang =
            language;

        document.documentElement.dir =
            language === "ar"
                ? "rtl"
                : "ltr";

        /* =================================================
           BACK TARGETS

           Back to Needs:
           return to the Needs screen of the current World.

           Back to Worlds:
           return to the Explore landing screen with Worlds.
           ================================================= */

        const backNeeds =
            document.getElementById(
                "backNeeds"
            );

        const backWorlds =
            document.getElementById(
                "backWorlds"
            );

        const backToNeedsURL =
            `../explore/?world=${encodeURIComponent(world)}`;

        backNeeds.href =
            backToNeedsURL;

        backWorlds.href =
            "../explore/";


        /* =================================================
           JSON HELPERS
           ================================================= */

        async function loadJSON(
            path
        ) {

            const response =
                await fetch(
                    path
                );

            if (
                !response.ok
            ) {

                throw new Error(
                    `Unable to load: ${path}`
                );
            }

            return response.json();
        }


        async function loadWithEnglishFallback(
            localizedPath,
            englishPath
        ) {

            try {

                return await loadJSON(
                    localizedPath
                );
            }

            catch (
                error
            ) {

                if (
                    language !== "en"
                ) {

                    try {

                        return await loadJSON(
                            englishPath
                        );
                    }

                    catch (
                        englishError
                    ) {

                        console.warn(
                            "VotZet English localization fallback failed:",
                            englishError
                        );
                    }
                }

                console.warn(
                    "VotZet localization fallback:",
                    error
                );

                return {};
            }
        }


        /* =================================================
           PRELOAD SHARED PLACEHOLDER IMAGE
           ================================================= */

        async function preloadPlaceholder() {

            const image =
                new Image();

            image.src =
                placeholderGraphic;

            try {

                if (
                    typeof image.decode ===
                    "function"
                ) {

                    await image.decode();

                    return;
                }
            }

            catch (
                error
            ) {
                /* use onload/onerror fallback below */
            }

            if (
                image.complete
            ) {
                return;
            }

            await new Promise(
                resolve => {

                    image.onload =
                        resolve;

                    image.onerror =
                        resolve;
                }
            );
        }


        /* =================================================
           LOAD EVERYTHING IN PARALLEL
           ================================================= */

        let common = {};
        let productGridLocale = {};
        let categoryLocale = {};
        let exploreLocale = {};
        let data = {
            products: []
        };

        try {

            [
                common,
                productGridLocale,
                categoryLocale,
                exploreLocale,
                data
            ] =
                await Promise.all([

                    loadWithEnglishFallback(
                        `../locales/${language}/common.json`,
                        "../locales/en/common.json"
                    ),

                    loadWithEnglishFallback(
                        interfacePath,
                        "../locales/en/product-grid.json"
                    ),

                    loadWithEnglishFallback(
                        productLocalePath,
                        `../locales/en/products/${world}-${need}.json`
                    ),

                    loadWithEnglishFallback(
                        exploreLocalePath,
                        "../locales/en/explore.json"
                    ),

                    loadJSON(
                        dataPath
                    ),

                    preloadPlaceholder()

                ]);

        }

        catch (
            error
        ) {

            console.error(
                "VotZet Product Grid loading error:",
                error
            );
        }


        /* =================================================
           NAVIGATION + PAGE INTERFACE
           ================================================= */

        document.getElementById(
            "navHome"
        ).textContent =
            common.home ||
            "Home";

        document.getElementById(
            "navDiscover"
        ).textContent =
            common.discover ||
            "Discover";

        document.getElementById(
            "navExplore"
        ).textContent =
            common.explore ||
            "Explore";

        const routeMap = {"men": ["health", "appearance", "status", "safety", "development"], "women": ["health", "beauty", "status", "safety", "development"], "children": ["health", "safety", "learning", "development", "creativity", "play", "comfort"], "seniors": ["health", "safety", "independence", "mobility", "comfort", "communication", "activities"], "family": ["health", "safety", "home", "comfort", "time-together", "travel"], "pets": ["health", "nutrition", "safety", "care", "comfort", "play", "travel-together", "technology"], "social": ["for-friends", "for-loved-ones", "stay-connected", "shared-interests", "activities"]};

        const localizedWorld =
            exploreLocale.worlds &&
            exploreLocale.worlds[world]
                ? exploreLocale.worlds[world]
                : {};

        const needIndex =
            routeMap[world]
                ? routeMap[world].indexOf(need)
                : -1;

        const localizedNeed =
            needIndex >= 0 &&
            Array.isArray(localizedWorld.items)
                ? localizedWorld.items[needIndex]
                : "";

        const derivedTitle =
            localizedWorld.title &&
            localizedNeed
                ? `${localizedWorld.title} — ${localizedNeed}`
                : (data.title || "VotZet Selection");

        document.getElementById(
            "categoryTitle"
        ).textContent =
            categoryLocale.title ||
            derivedTitle;

        document.getElementById(
            "categorySubtitle"
        ).textContent =
            categoryLocale.subtitle ||
            productGridLocale.categoryPlaceholderSubtitle ||
            "21 selected solutions. Selection in progress.";

        const values =
            productGridLocale.values ||
            {};

        const quality =
            values.quality ||
            {};

        const premium =
            values.premium ||
            {};

        const wellness =
            values.wellness ||
            {};

        const trust =
            values.trust ||
            {};

        document.getElementById(
            "valueQualityTitle"
        ).textContent =
            quality.title ||
            "Quality";

        document.getElementById(
            "valueQualityCopy"
        ).textContent =
            quality.text ||
            "Carefully selected for your well-being";

        document.getElementById(
            "valuePremiumTitle"
        ).textContent =
            premium.title ||
            "Premium";

        document.getElementById(
            "valuePremiumCopy"
        ).textContent =
            premium.text ||
            "Products that deliver real results";

        document.getElementById(
            "valueWellnessTitle"
        ).textContent =
            wellness.title ||
            "Wellness";

        document.getElementById(
            "valueWellnessCopy"
        ).textContent =
            wellness.text ||
            "Support for body, mind and lifestyle";

        document.getElementById(
            "valueTrustTitle"
        ).textContent =
            trust.title ||
            "Trust";

        document.getElementById(
            "valueTrustCopy"
        ).textContent =
            trust.text ||
            "Reliable solutions you can depend on";

        const backNeedsText =
            productGridLocale.backToNeeds ||
            "Back to Needs";

        const backWorldsText =
            productGridLocale.backToWorlds ||
            "Back to Worlds";

        function setBackButtonContent(element, text, direction) {
            element.textContent = "";

            const arrow = document.createElement("span");
            arrow.className = "back-arrow";
            arrow.textContent = direction === "left" ? "←" : "→";

            const label = document.createElement("span");
            label.textContent = text;

            if (direction === "left") {
                element.appendChild(arrow);
                element.appendChild(document.createTextNode(" "));
                element.appendChild(label);
            }
            else {
                element.appendChild(label);
                element.appendChild(document.createTextNode(" "));
                element.appendChild(arrow);
            }
        }

        if (language === "ar") {
            setBackButtonContent(document.getElementById("backNeeds"), backNeedsText, "right");
            setBackButtonContent(document.getElementById("backWorlds"), backWorldsText, "left");
        }
        else {
            setBackButtonContent(document.getElementById("backNeeds"), backNeedsText, "left");
            setBackButtonContent(document.getElementById("backWorlds"), backWorldsText, "right");
        }


        /* =================================================
           PRODUCT TRANSLATION HELPER
           ================================================= */

        function getLocalizedProduct(
            product
        ) {

            const translations =
                categoryLocale.products ||
                {};

            const localized =
                translations[
                    product.id
                ] ||
                {};

            return {
                ...product,

                localizedTitle:
                    localized.title ||
                    product.title ||
                    "",

                localizedShort:
                    localized.short ||
                    product.short ||
                    "",

                localizedAlt:
                    localized.alt ||
                    localized.title ||
                    product.title ||
                    ""
            };
        }


        /* =================================================
           PLACEHOLDER CARD
           ================================================= */

        function createPlaceholderCard(
            product
        ) {

            const placeholder =
                productGridLocale.placeholder ||
                {};

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "product-card";

            const inner =
                document.createElement(
                    "div"
                );

            inner.className =
                "placeholder-card-inner";

            const visualWrap =
                document.createElement(
                    "div"
                );

            visualWrap.className =
                "placeholder-vz-wrap";

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "placeholder-vz";

            image.src =
                placeholderGraphic;

            image.alt =
                "";

            /* Image is already preloaded before reveal. */
            image.loading =
                "eager";

            const state =
                document.createElement(
                    "div"
                );

            state.className =
                "placeholder-state";

            const selectionText =
                placeholder.selection ||
                "Selection";

            const progressText =
                placeholder.inProgress ||
                "In progress";

            state.textContent =
                selectionText;

            const progress =
                document.createElement(
                    "strong"
                );

            progress.textContent =
                progressText;

            state.appendChild(
                progress
            );

            const divider =
                document.createElement(
                    "div"
                );

            divider.className =
                "placeholder-divider";

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "product-slot";

            slot.textContent =
                String(
                    product.slot
                )
                .padStart(
                    2,
                    "0"
                );

            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "placeholder-badge";

            badge.textContent =
                "VotZet Selection";

            visualWrap.appendChild(
                image
            );

            inner.appendChild(
                visualWrap
            );

            inner.appendChild(
                state
            );

            inner.appendChild(
                divider
            );

            inner.appendChild(
                slot
            );

            inner.appendChild(
                badge
            );

            card.appendChild(
                inner
            );

            return card;
        }


        /* =================================================
           ACTIVE PRODUCT CARD
           ================================================= */

        function createActiveCard(
            sourceProduct
        ) {

            const product =
                getLocalizedProduct(
                    sourceProduct
                );

            const card =
                document.createElement(
                    "a"
                );

            card.className =
                "product-card active";

            card.href =
                product.url ||
                "#";

            const wrap =
                document.createElement(
                    "div"
                );

            wrap.className =
                "active-product-wrap";

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "product-image";

            image.src =
                product.image ||
                placeholderGraphic;

            image.alt =
                product.localizedAlt;

            image.loading =
                "lazy";

            const overlay =
                document.createElement(
                    "div"
                );

            overlay.className =
                "active-overlay";

            const name =
                document.createElement(
                    "h2"
                );

            name.className =
                "active-name";

            name.textContent =
                product.localizedTitle;

            const price =
                document.createElement(
                    "div"
                );

            price.className =
                "active-price";

            if (
                product.price
            ) {

                price.textContent =
                    `${product.price} ${product.currency || ""}`
                    .trim();
            }

            if (
                product.localizedShort
            ) {

                card.dataset.short =
                    product.localizedShort;
            }

            overlay.appendChild(
                name
            );

            overlay.appendChild(
                price
            );

            wrap.appendChild(
                image
            );

            wrap.appendChild(
                overlay
            );

            card.appendChild(
                wrap
            );

            return card;
        }


        function createCard(
            product
        ) {

            return product.status ===
                "active"

                ? createActiveCard(
                    product
                )

                : createPlaceholderCard(
                    product
                );
        }


        /* =================================================
           BUILD ALL 21 CARDS OFF-SCREEN
           ================================================= */

        const grid =
            document.getElementById(
                "productsGrid"
            );

        const fragment =
            document.createDocumentFragment();

        const products =
            Array.isArray(
                data.products
            )
                ? data.products
                : [];

        for (
            let slot = 1;
            slot <= 21;
            slot++
        ) {

            const existing =
                products.find(
                    product =>
                        Number(
                            product.slot
                        ) === slot
                );

            const product =
                existing || {
                    slot,
                    id:
                        `${world}-${need}-${String(slot).padStart(2,"0")}`,
                    status:
                        "placeholder",
                    title:
                        "",
                    short:
                        "",
                    price:
                        "",
                    currency:
                        "USD",
                    image:
                        "",
                    url:
                        ""
                };

            fragment.appendChild(
                createCard(
                    product
                )
            );
        }

        grid.replaceChildren(
            fragment
        );


        /* =================================================
           ONE REVEAL — ALREADY LOCALIZED AND COMPLETE
           ================================================= */

        requestAnimationFrame(
            () => {

                page.classList.add(
                    "product-grid-ready"
                );
            }
        );
    }
);

</script>

</body>
</html>
