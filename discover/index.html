<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Познать VotZet</title>
<link rel="stylesheet" href="../css/main.css">
<style>
/* DISCOVER: Основная страница */
body {
    margin: 0;
    background: #101113;
    color: #f2f2ef;
    overflow-x: hidden;
}
.discover-page {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, rgba(201,162,39,0.05), transparent 40%),
        #101113;
}
/* NAVIGATION: Верхняя навигация */
.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 17px 12px;
    background: rgba(8,9,10,0.94);
    border-bottom: 1px solid rgba(201,162,39,0.18);
    backdrop-filter: blur(12px);
}
.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.inner-nav a:hover {
    color: #e4c44f;
}
/* HERO: Вступительная часть */
.discover-content {
    width: 100%;
    box-sizing: border-box;
    padding: 58px 17px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.discover-intro {
    width: 100%;
    max-width: 760px;
    text-align: center;
}
.section-label {
    margin-bottom: 20px;
    color: #d8b83d;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
}
.discover-title {
    margin: 0 0 25px;
    color: #f2f2ef;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 1px;
}
.discover-lead {
    max-width: 700px;
    margin: 0 auto;
    color: #deded9;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.65;
}
.discover-motto {
    margin-top: 30px;
    color: #c9a227;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3.5px;
    text-transform: uppercase;
}
/* FOUNDATION: Заголовок документов */
.foundation-heading {
    width: 100%;
    max-width: 760px;
    margin: 68px auto 30px;
    text-align: center;
}
.foundation-heading h2 {
    margin: 0;
    color: #eeeeeb;
    font-size: 31px;
    font-weight: 400;
    letter-spacing: 1px;
}
.foundation-heading p {
    max-width: 620px;
    margin: 14px auto 0;
    color: #85868a;
    font-size: 13px;
    line-height: 1.65;
}
/* DOCUMENTS: Восемь документов */
.discover-documents {
    width: 100%;
    max-width: 760px;
    border-top: 1px solid rgba(255,255,255,0.1);
}
.discover-card {
    width: 100%;
    box-sizing: border-box;
    padding: 21px 3px;
    display: grid;
    grid-template-columns: 30px minmax(0,1fr) 22px;
    column-gap: 11px;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    transition: background 0.25s ease;
}
.discover-card:hover {
    background: rgba(201,162,39,0.035);
}
.card-number {
    align-self: start;
    padding-top: 4px;
    color: #c9a227;
    font-size: 10px;
    letter-spacing: 2px;
}
.card-main {
    min-width: 0;
}
.discover-card h3 {
    margin: 0;
    color: #eeeeeb;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: 1.2px;
}
.discover-card p {
    margin: 8px 0 0;
    color: #85868a;
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.55;
}
.document-button {
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    background: transparent;
    color: #c9a227;
    font-size: 22px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
}
.document-button:hover {
    color: #f0d66b;
    transform: translateX(3px);
}
/* FOOTER: Нижняя часть */
.discover-bottom {
    width: 100%;
    max-width: 680px;
    margin: 65px auto 0;
    text-align: center;
}
.discover-bottom p {
    margin: 0 auto 24px;
    color: #818287;
    font-size: 13px;
    line-height: 1.7;
}
.back-home {
    display: inline-block;
    padding: 11px 25px;
    border: 1px solid rgba(201,162,39,0.75);
    border-radius: 28px;
    color: #d8b83d;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}
.back-home:hover {
    background: #d8b83d;
    color: #101113;
}
/* MODAL: Просмотр документа */
.document-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    box-sizing: border-box;
    background: rgba(5,6,7,0.84);
    backdrop-filter: blur(10px);
}
.document-modal.open {
    display: flex;
}
.document-modal-box {
    width: 100%;
    max-width: 760px;
    max-height: 90vh;
    box-sizing: border-box;
    overflow-y: auto;
    padding: 28px 20px 32px;
    background: #17191b;
    border: 1px solid rgba(201,162,39,0.32);
    box-shadow: 0 25px 80px rgba(0,0,0,0.55);
}
.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 26px;
}
.modal-title {
    margin: 0;
    color: #f2f2ef;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 1px;
}
.modal-close {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(201,162,39,0.4);
    border-radius: 50%;
    background: transparent;
    color: #d7b83e;
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
}
.modal-text {
    color: #c9c9c5;
    font-size: 14px;
    line-height: 1.8;
}
.modal-text p {
    margin: 0 0 22px;
}
@media (max-width: 380px) {
    .inner-nav {
        gap: 16px;
    }
    .inner-nav a {
        font-size: 8px;
        letter-spacing: 1.6px;
    }
    .discover-title {
        font-size: 37px;
    }
    .discover-lead {
        font-size: 17px;
    }
}
</style>
</head>
<body>

<!-- DISCOVER PAGE: Основной контейнер -->
<div class="discover-page">

<!-- NAVIGATION: Навигация -->
<nav class="inner-nav">
    <a href="../index.html" data-nav-sound="home" id="navHome">Главная</a>
    <a href="../explore/" data-nav-sound="explore" id="navExplore">Исследовать</a>
    <a href="./" data-nav-sound="discover" id="navDiscover">Познать</a>
</nav>

<!-- HERO: Заголовок Discover -->
<main class="discover-content">
    <section class="discover-intro">
        <div class="section-label" id="discoverLabel">Познать</div>
        <h1 class="discover-title" id="discoverTitle">Познать VotZet</h1>
        <p class="discover-lead" id="discoverSubtitle">Кто мы. Во что верим. Зачем существуем. Каким видим мир, который хотим создать.</p>
        <div class="discover-motto">That's your world.</div>
    </section>

<!-- FOUNDATION: Заголовок библиотеки -->
    <section class="foundation-heading">
        <div class="section-label" id="foundationLabel">Наша основа</div>
        <h2 id="foundationTitle">Восемь документов</h2>
        <p id="foundationText">Идеи и принципы, на которых строится VotZet.</p>
    </section>

<!-- DOCUMENTS: Ровно восемь утверждённых документов -->
    <section class="discover-documents" id="discoverDocuments"></section>

<!-- FOOTER: Завершение страницы -->
    <section class="discover-bottom">
        <p id="discoverFooter">Познай основу. Познай идею. А затем выбери свой мир.</p>
        <a class="back-home" href="../index.html" data-nav-sound="home" id="backHome">Главная</a>
    </section>
</main>
</div>

<!-- DOCUMENT MODAL: Окно документа -->
<div class="document-modal" id="documentModal">
    <div class="document-modal-box">
        <div class="modal-top">
            <h2 class="modal-title" id="modalTitle"></h2>
            <button class="modal-close" id="modalClose" type="button">×</button>
        </div>
        <div class="modal-text" id="modalText"></div>
    </div>
</div>

<!-- MAIN SYSTEM: Навигация и звук -->
<script src="../js/main.js"></script>

<!-- LANGUAGE SYSTEM: Сохранённый язык -->
<script src="../js/language.js"></script>

<!-- DISCOVER CONTENT: Загрузка русской локализации -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

    const language = localStorage.getItem("votzet-language") || "ru";

    /*
    DOCUMENT ORDER:
    01 Mission
    02 Vision
    03 Manifesto
    04 Philosophy
    05 Canon
    06 Constitution
    07 Codex
    08 Code
    */
    const documentOrder = [
        "mission",
        "vision",
        "manifesto",
        "philosophy",
        "canon",
        "constitution",
        "codex",
        "code"
    ];

    try {

        const response = await fetch(`../locales/${language}/discover.json`);

        if (!response.ok) {
            throw new Error(`Discover localization not found: ${language}`);
        }

        const content = await response.json();

        document.documentElement.lang = language;

        /* CONTENT: Заголовок Discover */
        if (content.title) {
            document.getElementById("discoverTitle").textContent = content.title;
        }

        if (content.subtitle) {
            document.getElementById("discoverSubtitle").textContent = content.subtitle;
        }

        /* DOCUMENTS: Формирование восьми карточек */
        const documentsContainer =
            document.getElementById("discoverDocuments");

        documentsContainer.innerHTML = "";

        documentOrder.forEach((key, index) => {

            const documentData = content[key];

            if (!documentData) {
                console.warn(`Missing Discover document: ${key}`);
                return;
            }

            const card = document.createElement("article");
            card.className = "discover-card";

            const number = String(index + 1).padStart(2, "0");

            const numberElement = document.createElement("div");
            numberElement.className = "card-number";
            numberElement.textContent = number;

            const mainElement = document.createElement("div");
            mainElement.className = "card-main";

            const titleElement = document.createElement("h3");
            titleElement.textContent = documentData.title || "";

            const shortElement = document.createElement("p");
            shortElement.textContent = documentData.short || "";

            mainElement.appendChild(titleElement);
            mainElement.appendChild(shortElement);

            const button = document.createElement("button");
            button.className = "document-button";
            button.type = "button";
            button.textContent = "→";
            button.setAttribute(
                "aria-label",
                `Читать ${documentData.title || ""}`
            );

            button.addEventListener("click", () => {
                openDocument(documentData);
            });

            card.appendChild(numberElement);
            card.appendChild(mainElement);
            card.appendChild(button);

            documentsContainer.appendChild(card);
        });

    } catch (error) {

        console.error("VotZet Discover error:", error);

    }

    /* MODAL: Открытие документа */
    function openDocument(documentData) {

        document.getElementById("modalTitle").textContent =
            documentData.title || "";

        const modalText =
            document.getElementById("modalText");

        modalText.innerHTML = "";

        const text = documentData.text || "";

        if (text.trim()) {

            text.split(/\n\s*\n/).forEach(paragraph => {

                const p = document.createElement("p");
                p.textContent = paragraph.trim();

                modalText.appendChild(p);

            });

        }

        document.getElementById("documentModal")
            .classList.add("open");

        document.body.style.overflow = "hidden";
    }

    /* MODAL: Закрытие документа */
    function closeDocument() {

        document.getElementById("documentModal")
            .classList.remove("open");

        document.body.style.overflow = "";
    }

    document.getElementById("modalClose")
        .addEventListener("click", closeDocument);

    document.getElementById("documentModal")
        .addEventListener("click", event => {

            if (event.target.id === "documentModal") {
                closeDocument();
            }

        });

    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {
            closeDocument();
        }

    });

});
</script>

</body>
</html>
