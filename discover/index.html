<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover — VotZet</title>

<meta
    name="description"
    content="Discover VotZet — our mission, vision, philosophy and principles."
>

<link
    rel="stylesheet"
    href="../css/main.css"
>

<style>

/* =========================================================
   DISCOVER VOTZET 2.2
   ========================================================= */

body {
    margin: 0;
    background: #101113;
    color: #f2f2ef;
    overflow-x: hidden;
    overflow-y: auto;
}

.discover-page {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(201,162,39,0.045),
            transparent 40%
        ),
        #101113;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 28px;
    padding: 17px 12px;

    background:
        rgba(8,9,10,0.94);

    border-bottom:
        1px solid rgba(201,162,39,0.18);

    backdrop-filter:
        blur(12px);
}

.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 2px;
    text-transform: uppercase;
}

.inner-nav a:hover {
    color: #e4c44f;
}


/* =========================================================
   PAGE
   ========================================================= */

.discover-content {
    width: 100%;
    box-sizing: border-box;

    padding:
        58px 17px 70px;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================================================
   INTRO
   ========================================================= */

.discover-intro {
    width: 100%;
    max-width: 760px;

    text-align: center;
}

.section-label {
    margin-bottom: 20px;

    color: #d8b83d;

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 5px;
    text-transform: uppercase;
}

.discover-title {
    margin:
        0 0 22px;

    color: #f2f2ef;

    font-size: 42px;
    font-weight: 400;

    line-height: 1.08;
    letter-spacing: 1px;
}

.discover-lead {
    max-width: 700px;

    margin:
        0 auto;

    color: #deded9;

    font-size: 18px;
    font-weight: 400;

    line-height: 1.65;
}

.discover-motto {
    margin-top: 28px;

    color: #c9a227;

    font-size: 10px;
    font-weight: 400;

    letter-spacing: 3.5px;
    text-transform: uppercase;
}


/* =========================================================
   MANIFESTO INTRO
   ========================================================= */

.manifesto-intro {
    width: 100%;
    max-width: 680px;

    box-sizing: border-box;

    margin:
        55px auto 0;

    padding:
        31px 18px;

    text-align: center;

    border-top:
        1px solid rgba(201,162,39,0.18);

    border-bottom:
        1px solid rgba(201,162,39,0.18);
}

.manifesto-primary {
    margin:
        0 0 18px;

    color: #eeeeeb;

    font-size: 17px;
    font-weight: 400;

    line-height: 1.6;
}

.manifesto-line {
    margin:
        5px 0;

    color: #96979a;

    font-size: 13px;

    line-height: 1.6;
}

.manifesto-final {
    margin:
        18px 0 0;

    color: #c9a227;

    font-size: 11px;

    letter-spacing: 2px;
    text-transform: uppercase;
}


/* =========================================================
   CORE HEADING
   ========================================================= */

.core-heading {
    width: 100%;
    max-width: 760px;

    margin:
        66px auto 30px;

    text-align: center;
}

.core-heading h2 {
    margin: 0;

    color: #eeeeeb;

    font-size: 29px;
    font-weight: 400;

    line-height: 1.2;
    letter-spacing: 1px;
}

.core-heading p {
    max-width: 620px;

    margin:
        13px auto 0;

    color: #85868a;

    font-size: 13px;

    line-height: 1.55;
}


/* =========================================================
   FOUR CORE DOCUMENTS
   ========================================================= */

.discover-documents {
    width: 100%;
    max-width: 760px;

    border-top:
        1px solid rgba(255,255,255,0.1);
}

.discover-card {
    -webkit-tap-highlight-color: transparent;

    width: 100%;
    box-sizing: border-box;

    padding:
        22px 14px;

    display: grid;

    grid-template-columns:
        30px minmax(0,1fr);

    column-gap: 11px;
    align-items: center;

    border: none;

    border-bottom:
        1px solid rgba(255,255,255,0.1);

    background: transparent;

    color: inherit;
    font-family: inherit;

    text-align: left;

    cursor: pointer;

    transition:
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
}

.discover-card:hover {
    background:
        rgba(201,162,39,0.04);
}

.discover-card:focus {
    outline: none;
}

.discover-card.selected {
    background:
        rgba(201,162,39,0.22);

    box-shadow:
        inset 0 0 0 1px rgba(228,196,79,0.65),
        0 0 20px rgba(201,162,39,0.16);

    transform:
        translateY(-1px);
}

.discover-card.selected h3 {
    color: #e4c44f;
}

.card-number {
    align-self: start;

    padding-top: 4px;

    color: #c9a227;

    font-size: 10px;

    letter-spacing: 2px;
}

.card-main {
    min-width: 0;
}

.discover-card h3 {
    margin: 0;

    color: #eeeeeb;

    font-size: 18px;
    font-weight: 400;

    line-height: 1.25;

    letter-spacing: 1.2px;

    transition:
        color 0.18s ease;
}

.discover-card p {
    margin:
        8px 0 0;

    color: #85868a;

    font-size: 12.5px;
    font-weight: 400;

    line-height: 1.55;
}


/* =========================================================
   SECONDARY DOCUMENT BUTTON
   ========================================================= */

.document-button {
    -webkit-tap-highlight-color: transparent;

    width: 22px;
    height: 22px;

    padding: 0;

    border: none;

    background: transparent;

    color: #c9a227;

    font-size: 22px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.document-button:hover {
    color: #f0d66b;

    transform:
        translateX(3px);
}


/* =========================================================
   UNDERSTAND US DEEPER
   ========================================================= */

.deeper-section {
    width: 100%;
    max-width: 760px;

    margin:
        70px auto 0;
}

.deeper-box {
    box-sizing: border-box;

    padding:
        30px 25px;

    border:
        1px solid rgba(201,162,39,0.25);

    background:
        linear-gradient(
            135deg,
            rgba(201,162,39,0.035),
            rgba(255,255,255,0.008)
        );
}

.deeper-label {
    margin-bottom: 14px;

    color: #c9a227;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;
}

.deeper-title {
    margin: 0;

    color: #eeeeeb;

    font-size: 23px;
    font-weight: 400;

    letter-spacing: 1px;
}

.deeper-short {
    max-width: 610px;

    margin:
        11px 0 0;

    color: #a0a1a3;

    font-size: 13px;

    line-height: 1.65;
}

.deeper-intro {
    max-width: 650px;

    margin:
        18px 0 0;

    color: #77787c;

    font-size: 12px;

    line-height: 1.65;
}


/* =========================================================
   LARGE DEEPER TOGGLE
   ========================================================= */

.deeper-toggle {
    -webkit-tap-highlight-color: transparent;

    width: 100%;

    margin-top: 24px;

    padding:
        13px 0 8px;

    display: flex;

    justify-content: center;
    align-items: center;

    border: none;

    background: transparent;

    color: #d8b83d;

    font-family: inherit;

    font-size: 30px;
    font-weight: 300;

    line-height: 1;

    cursor: pointer;

    transition:
        color 0.18s ease,
        transform 0.18s ease,
        background 0.18s ease;
}

.deeper-toggle:hover {
    color: #f0d66b;

    background:
        rgba(201,162,39,0.025);
}

.deeper-toggle:active {
    transform:
        translateY(2px);
}

.deeper-toggle:focus {
    outline: none;
}


/* =========================================================
   DEEPER DOCUMENTS
   ========================================================= */

.deeper-documents {
    display: none;

    margin-top: 22px;

    border-top:
        1px solid rgba(255,255,255,0.09);
}

.deeper-documents.open {
    display: block;
}

.deeper-document {
    display: grid;

    grid-template-columns:
        minmax(0,1fr) 22px;

    column-gap: 12px;

    align-items: center;

    padding:
        18px 0;

    border-bottom:
        1px solid rgba(255,255,255,0.08);
}

.deeper-document h4 {
    margin: 0;

    color: #d8d8d4;

    font-size: 15px;
    font-weight: 400;

    letter-spacing: 1px;
}

.deeper-document p {
    margin:
        6px 0 0;

    color: #747579;

    font-size: 12px;

    line-height: 1.5;
}

.deeper-document
.document-button:disabled {
    opacity: 0.28;

    cursor: default;

    transform: none;
}


/* =========================================================
   FOOTER
   ========================================================= */

.discover-bottom {
    width: 100%;
    max-width: 680px;

    margin:
        65px auto 0;

    text-align: center;
}

.discover-bottom p {
    margin:
        0 auto 24px;

    color: #818287;

    font-size: 13px;

    line-height: 1.7;
}

.back-home {
    display: inline-block;

    padding:
        11px 25px;

    border:
        1px solid rgba(201,162,39,0.75);

    border-radius: 28px;

    color: #d8b83d;

    text-decoration: none;

    font-size: 9px;
    font-weight: 400;

    letter-spacing: 2.5px;

    text-transform: uppercase;
}

.back-home:hover {
    background: #d8b83d;

    color: #101113;
}


/* =========================================================
   DOCUMENT MODAL
   ========================================================= */

.document-modal {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    box-sizing: border-box;

    background:
        rgba(5,6,7,0.84);

    backdrop-filter:
        blur(10px);
}

.document-modal.open {
    display: flex;
}

.document-modal-box {
    width: 100%;
    max-width: 760px;

    max-height: 90vh;

    box-sizing: border-box;

    overflow-y: auto;

    padding:
        28px 20px 32px;

    background: #17191b;

    border:
        1px solid rgba(201,162,39,0.32);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.55);
}

.modal-top {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 20px;

    margin-bottom: 26px;
}

.modal-title {
    margin: 0;

    color: #f2f2ef;

    font-size: 24px;
    font-weight: 400;

    letter-spacing: 1px;
}

.modal-close {
    -webkit-tap-highlight-color: transparent;

    flex:
        0 0 auto;

    width: 32px;
    height: 32px;

    padding: 0;

    border:
        1px solid rgba(201,162,39,0.4);

    border-radius: 50%;

    background: transparent;

    color: #d7b83e;

    font-size: 20px;
    font-weight: 300;

    cursor: pointer;
}

.modal-close:focus {
    outline: none;
}

.modal-text {
    color: #c9c9c5;

    font-size: 14px;

    line-height: 1.8;
}

.modal-text p {
    margin:
        0 0 22px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .inner-nav {
        gap: 16px;
    }

    .inner-nav a {
        font-size: 8px;

        letter-spacing: 1.6px;
    }

    .discover-title {
        font-size: 37px;
    }

    .discover-lead {
        font-size: 17px;
    }

    .core-heading h2 {
        font-size: 26px;
    }

    .deeper-box {
        padding:
            26px 18px;
    }
}

</style>
</head>


<body>

<div class="discover-page">


<!-- =====================================================
     NAVIGATION
     ===================================================== -->

<nav class="inner-nav">

    <a
        href="../index.html"
        id="navHome"
        data-nav-sound="home"
    ></a>

    <a
        href="./"
        id="navDiscover"
        data-nav-sound="discover"
    ></a>

    <a
        href="../explore/"
        id="navExplore"
        data-nav-sound="explore"
    ></a>

</nav>


<!-- =====================================================
     CONTENT
     ===================================================== -->

<main class="discover-content">


<!-- =====================================================
     INTRO
     ===================================================== -->

<section class="discover-intro">

    <div class="section-label">
        VotZet
    </div>

    <h1
        class="discover-title"
        id="discoverTitle"
    ></h1>

    <p
        class="discover-lead"
        id="discoverSubtitle"
    ></p>

    <div class="discover-motto">
        That's your world.
    </div>

</section>


<!-- =====================================================
     MANIFESTO
     ===================================================== -->

<section
    class="manifesto-intro"
    id="manifestoIntro"
>

    <p
        class="manifesto-primary"
        id="manifestoLine1"
    ></p>

    <p
        class="manifesto-line"
        id="manifestoLine2"
    ></p>

    <p
        class="manifesto-line"
        id="manifestoLine3"
    ></p>

    <p
        class="manifesto-final"
        id="manifestoLine4"
    ></p>

</section>


<!-- =====================================================
     CORE
     ===================================================== -->

<section class="core-heading">

    <div class="section-label">
        VotZet
    </div>

    <h2 id="coreTitle"></h2>

    <p id="coreDescription"></p>

</section>


<section
    class="discover-documents"
    id="discoverDocuments"
></section>


<!-- =====================================================
     UNDERSTAND US DEEPER
     ===================================================== -->

<section class="deeper-section">

    <div class="deeper-box">

        <div class="deeper-label">
            VotZet Foundation
        </div>

        <h2
            class="deeper-title"
            id="deeperTitle"
        ></h2>

        <p
            class="deeper-short"
            id="deeperShort"
        ></p>

        <p
            class="deeper-intro"
            id="deeperIntro"
        ></p>

        <button
            class="deeper-toggle"
            id="deeperToggle"
            type="button"
            aria-expanded="false"
            aria-controls="deeperDocuments"
        >
            ↓
        </button>

        <div
            class="deeper-documents"
            id="deeperDocuments"
        ></div>

    </div>

</section>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<section class="discover-bottom">

    <p id="discoverFooter"></p>

    <a
        class="back-home"
        href="../index.html"
        id="backHome"
        data-nav-sound="home"
    ></a>

</section>


</main>
</div>


<!-- =====================================================
     DOCUMENT MODAL
     ===================================================== -->

<div
    class="document-modal"
    id="documentModal"
>

    <div class="document-modal-box">

        <div class="modal-top">

            <h2
                class="modal-title"
                id="modalTitle"
            ></h2>

            <button
                class="modal-close"
                id="modalClose"
                type="button"
            >
                ×
            </button>

        </div>

        <div
            class="modal-text"
            id="modalText"
        ></div>

    </div>

</div>


<!-- =====================================================
     EXISTING SYSTEMS
     ===================================================== -->

<script src="../js/main.js"></script>
<script src="../js/language.js"></script>


<!-- =====================================================
     DISCOVER 2.2 SYSTEM
     ===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {


/* -----------------------------------------------------
   SETTINGS
   ----------------------------------------------------- */

const SELECTION_DELAY =
    130;


/* -----------------------------------------------------
   LANGUAGE
   ----------------------------------------------------- */

const language =
    localStorage.getItem(
        "votzet-language"
    ) || "en";


/* -----------------------------------------------------
   DOCUMENT ORDER
   ----------------------------------------------------- */

const documentOrder = [
    "mission",
    "vision",
    "philosophy",
    "principles"
];


const deeperOrder = [
    "ecosystem",
    "codex",
    "canon",
    "standards"
];


let transitionLocked =
    false;


try {


/* -----------------------------------------------------
   LOAD LOCALIZATION
   ----------------------------------------------------- */

const [
    commonResponse,
    discoverResponse
] =
    await Promise.all([

        fetch(
            `../locales/${language}/common.json`
        ),

        fetch(
            `../locales/${language}/discover.json`
        )

    ]);


if (
    !commonResponse.ok ||
    !discoverResponse.ok
) {

    throw new Error(
        `Localization unavailable: ${language}`
    );
}


const [
    common,
    discover
] =
    await Promise.all([

        commonResponse.json(),
        discoverResponse.json()

    ]);


document.documentElement.lang =
    language;


/* -----------------------------------------------------
   NAVIGATION
   ----------------------------------------------------- */

document.getElementById(
    "navHome"
).textContent =
    common.home || "Home";


document.getElementById(
    "navDiscover"
).textContent =
    common.discover || "Discover";


document.getElementById(
    "navExplore"
).textContent =
    common.explore || "Explore";


document.getElementById(
    "backHome"
).textContent =
    common.home || "Home";


/* -----------------------------------------------------
   INTRO
   ----------------------------------------------------- */

document.getElementById(
    "discoverTitle"
).textContent =
    discover.title ||
    "Discover VotZet";


document.getElementById(
    "discoverSubtitle"
).textContent =
    discover.subtitle || "";


/* -----------------------------------------------------
   MANIFESTO
   ----------------------------------------------------- */

const manifesto =
    discover.manifesto || {};


document.getElementById(
    "manifestoLine1"
).textContent =
    manifesto.line1 || "";


document.getElementById(
    "manifestoLine2"
).textContent =
    manifesto.line2 || "";


document.getElementById(
    "manifestoLine3"
).textContent =
    manifesto.line3 || "";


document.getElementById(
    "manifestoLine4"
).textContent =
    manifesto.line4 || "";


/* -----------------------------------------------------
   CORE HEADING
   ----------------------------------------------------- */

document.getElementById(
    "coreTitle"
).textContent =
    language === "ru"
        ? "Основа VotZet"
        : "The Core of VotZet";


document.getElementById(
    "coreDescription"
).textContent =
    language === "ru"
        ? "Зачем мы существуем. Куда идём. Во что верим. Как действуем."
        : "Why we exist. Where we are going. What we believe. How we act.";


/* -----------------------------------------------------
   SOUND HELPER
   ----------------------------------------------------- */

function playDocumentSound() {

    if (
        typeof window.VotZetSound ===
        "function"
    ) {

        window.VotZetSound(
            "document"
        );
    }
}


/* -----------------------------------------------------
   CORE CARD SELECTION
   ----------------------------------------------------- */

function confirmCardSelection(
    card,
    callback
) {

    if (
        transitionLocked
    ) {
        return;
    }

    transitionLocked =
        true;

    playDocumentSound();

    card.classList.add(
        "selected"
    );

    setTimeout(
        () => {

            card.classList.remove(
                "selected"
            );

            transitionLocked =
                false;

            callback();

        },
        SELECTION_DELAY
    );
}


/* -----------------------------------------------------
   FOUR CORE DOCUMENTS
   ----------------------------------------------------- */

const container =
    document.getElementById(
        "discoverDocuments"
    );


container.innerHTML =
    "";


documentOrder.forEach(
    (key, index) => {


const documentData =
    discover[key];


if (
    !documentData
) {

    console.error(
        `VotZet Discover: missing "${key}"`
    );

    return;
}


const card =
    document.createElement(
        "button"
    );


card.type =
    "button";


card.className =
    "discover-card";


const number =
    document.createElement(
        "div"
    );


number.className =
    "card-number";


number.textContent =
    String(index + 1)
        .padStart(
            2,
            "0"
        );


const main =
    document.createElement(
        "div"
    );


main.className =
    "card-main";


const title =
    document.createElement(
        "h3"
    );


title.textContent =
    documentData.title ||
    "";


const short =
    document.createElement(
        "p"
    );


short.textContent =
    documentData.short ||
    "";


main.appendChild(
    title
);


main.appendChild(
    short
);


card.appendChild(
    number
);


card.appendChild(
    main
);


card.addEventListener(
    "click",
    () => {

        confirmCardSelection(
            card,
            () => {

                openDocument(
                    documentData
                );
            }
        );
    }
);


container.appendChild(
    card
);


});


/* -----------------------------------------------------
   UNDERSTAND US DEEPER
   ----------------------------------------------------- */

const deeper =
    discover.deeper || {};


document.getElementById(
    "deeperTitle"
).textContent =
    deeper.title ||
    "Understand Us Deeper";


document.getElementById(
    "deeperShort"
).textContent =
    deeper.short || "";


document.getElementById(
    "deeperIntro"
).textContent =
    deeper.intro || "";


const deeperContainer =
    document.getElementById(
        "deeperDocuments"
    );


deeperContainer.innerHTML =
    "";


deeperOrder.forEach(
    key => {


const data =
    deeper[key];


if (
    !data
) {
    return;
}


const row =
    document.createElement(
        "article"
    );


row.className =
    "deeper-document";


const content =
    document.createElement(
        "div"
    );


const title =
    document.createElement(
        "h4"
    );


title.textContent =
    data.title || "";


const short =
    document.createElement(
        "p"
    );


short.textContent =
    data.short || "";


content.appendChild(
    title
);


content.appendChild(
    short
);


const button =
    document.createElement(
        "button"
    );


button.className =
    "document-button";


button.type =
    "button";


button.textContent =
    "→";


if (
    data.text &&
    data.text.trim()
) {

    button.addEventListener(
        "click",
        () => {

            playDocumentSound();

            openDocument(
                data
            );
        }
    );
}

else {

    button.disabled =
        true;
}


row.appendChild(
    content
);


row.appendChild(
    button
);


deeperContainer.appendChild(
    row
);


});


/* -----------------------------------------------------

    "discoverFooter"
).textContent =

        : "Understand the idea. Explore the possibilities. Choose your world.";

/* -----------------------------------------------------
   OPEN DOCUMENT
   ----------------------------------------------------- */

function openDocument(
    documentData
) {


document.getElementById(
    "modalTitle"
).textContent =
    documentData.title || "";


const modalText =
    document.getElementById(
        "modalText"
    );


modalText.innerHTML =
    "";


const text =
    documentData.text ||
    "";


text
    .split(
        /\n\s*\n/
    )
    .filter(
        paragraph =>
            paragraph.trim()
    )
    .forEach(
        paragraph => {


const p =
    document.createElement(
        "p"
    );


p.textContent =
    paragraph.trim();


modalText.appendChild(
    p
);


});


document.getElementById(
    "documentModal"
).classList.add(
    "open"
);


document.body.style.overflow =
    "hidden";


}


/* -----------------------------------------------------
   CLOSE DOCUMENT
   ----------------------------------------------------- */

function closeDocument() {


document.getElementById(
    "documentModal"
).classList.remove(
    "open"
);


document.body.style.overflow =
    "";


}


document.getElementById(
    "modalClose"
).addEventListener(
    "click",
    closeDocument
);


document.getElementById(
    "documentModal"
).addEventListener(
    "click",
    event => {


if (
    event.target.id ===
    "documentModal"
) {

    closeDocument();

}


});


document.addEventListener(
    "keydown",
    event => {


if (
    event.key === "Escape"
) {

    closeDocument();

}


});


/* -----------------------------------------------------
   DEEPER TOGGLE
   ----------------------------------------------------- */

const deeperToggle =
    document.getElementById(
        "deeperToggle"
    );


const deeperDocuments =
    document.getElementById(
        "deeperDocuments"
    );


deeperToggle.addEventListener(
    "click",
    () => {


const isOpen =
    deeperDocuments.classList.toggle(
        "open"
    );


deeperToggle.textContent =
    isOpen
        ? "↑"
        : "↓";


deeperToggle.setAttribute(
    "aria-expanded",
    isOpen
        ? "true"
        : "false"
);


});


});

</script>
