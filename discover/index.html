<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover — VotZet</title>
<link rel="stylesheet" href="../css/main.css">
<style>
/* DISCOVER PAGE: Основная визуальная структура */
body {
    margin: 0;
    background: #101113;
    color: #f2f2ef;
    overflow-x: hidden;
}
.discover-page {
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 0%, rgba(201,162,39,0.045), transparent 40%),
        #101113;
}
/* NAVIGATION: Внутренняя навигация */
.inner-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 17px 12px;
    background: rgba(8,9,10,0.94);
    border-bottom: 1px solid rgba(201,162,39,0.18);
    backdrop-filter: blur(12px);
}
.inner-nav a {
    color: #f2f2ef;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.inner-nav a:hover {
    color: #e4c44f;
}
/* HERO: Вступительная часть Discover */
.discover-content {
    width: 100%;
    box-sizing: border-box;
    padding: 58px 17px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.discover-intro {
    width: 100%;
    max-width: 760px;
    text-align: center;
}
.section-label {
    margin-bottom: 20px;
    color: #d8b83d;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
}
.discover-title {
    margin: 0 0 25px;
    color: #f2f2ef;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: 1px;
}
.discover-lead {
    max-width: 700px;
    margin: 0 auto;
    color: #deded9;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.65;
}
.discover-motto {
    margin-top: 30px;
    color: #c9a227;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3.5px;
    text-transform: uppercase;
}
/* FOUNDATION: Заголовок восьми документов */
.foundation-heading {
    width: 100%;
    max-width: 760px;
    margin: 68px auto 30px;
    text-align: center;
}
.foundation-heading .section-label {
    margin-bottom: 16px;
}
.foundation-heading h2 {
    margin: 0;
    color: #eeeeeb;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 1px;
}
.foundation-heading p {
    max-width: 620px;
    margin: 13px auto 0;
    color: #85868a;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.55;
}
/* DOCUMENTS: Ровно восемь документов */
.discover-documents {
    width: 100%;
    max-width: 760px;
    border-top: 1px solid rgba(255,255,255,0.1);
}
.discover-card {
    width: 100%;
    box-sizing: border-box;
    padding: 21px 3px;
    display: grid;
    grid-template-columns: 30px minmax(0,1fr) 22px;
    column-gap: 11px;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    transition: background 0.25s ease;
}
.discover-card:hover {
    background: rgba(201,162,39,0.035);
}
.card-number {
    align-self: start;
    padding-top: 4px;
    color: #c9a227;
    font-size: 10px;
    letter-spacing: 2px;
}
.card-main {
    min-width: 0;
}
.discover-card h3 {
    margin: 0;
    color: #eeeeeb;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: 1.2px;
}
.discover-card p {
    margin: 8px 0 0;
    color: #85868a;
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.55;
}
.document-button {
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    background: transparent;
    color: #c9a227;
    font-size: 22px;
    font-weight: 300;
    line-height: 1;
    cursor: pointer;
}
.document-button:hover {
    color: #f0d66b;
    transform: translateX(3px);
}
/* FOOTER: Нижняя часть */
.discover-bottom {
    width: 100%;
    max-width: 680px;
    margin: 65px auto 0;
    text-align: center;
}
.discover-bottom p {
    margin: 0 auto 24px;
    color: #818287;
    font-size: 13px;
    line-height: 1.7;
}
.back-home {
    display: inline-block;
    padding: 11px 25px;
    border: 1px solid rgba(201,162,39,0.75);
    border-radius: 28px;
    color: #d8b83d;
    text-decoration: none;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}
.back-home:hover {
    background: #d8b83d;
    color: #101113;
}
/* MODAL: Окно документа */
.document-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    box-sizing: border-box;
    background: rgba(5,6,7,0.84);
    backdrop-filter: blur(10px);
}
.document-modal.open {
    display: flex;
}
.document-modal-box {
    width: 100%;
    max-width: 760px;
    max-height: 90vh;
    box-sizing: border-box;
    overflow-y: auto;
    padding: 28px 20px 32px;
    background: #17191b;
    border: 1px solid rgba(201,162,39,0.32);
    box-shadow: 0 25px 80px rgba(0,0,0,0.55);
}
.modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 26px;
}
.modal-title {
    margin: 0;
    color: #f2f2ef;
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 1px;
}
.modal-close {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(201,162,39,0.4);
    border-radius: 50%;
    background: transparent;
    color: #d7b83e;
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
}
.modal-text {
    color: #c9c9c5;
    font-size: 14px;
    line-height: 1.8;
}
.modal-text p {
    margin: 0 0 22px;
}
@media (max-width: 380px) {
    .inner-nav {
        gap: 16px;
    }
    .inner-nav a {
        font-size: 8px;
        letter-spacing: 1.6px;
    }
    .discover-title {
        font-size: 37px;
    }
    .discover-lead {
        font-size: 17px;
    }
    .foundation-heading h2 {
        font-size: 27px;
    }
}
/* MOBILE: Предотвращаем слишком длинные заголовки */
@media (max-width: 340px) {
    .discover-card h3 {
        font-size: 17px;
    }
    .discover-card p {
        font-size: 12px;
    }
}
</style>
</head>
<body>

<!-- DISCOVER PAGE: Контейнер страницы -->
<div class="discover-page">

<!-- NAVIGATION: Навигация с сохранением существующих звуков -->
<nav class="inner-nav">
    <a href="../index.html" id="navHome" data-nav-sound="home"></a>
    <a href="../explore/" id="navExplore" data-nav-sound="explore"></a>
    <a href="./" id="navDiscover" data-nav-sound="discover"></a>
</nav>

<!-- HERO: Заголовок Discover -->
<main class="discover-content">
    <section class="discover-intro">
        <div class="section-label" id="discoverLabel">VotZet</div>
        <h1 class="discover-title" id="discoverTitle"></h1>
        <p class="discover-lead" id="discoverSubtitle"></p>
        <div class="discover-motto">That's your world.</div>
    </section>

<!-- FOUNDATION: Восемь документов -->
    <section class="foundation-heading">
        <div class="section-label" id="foundationLabel"></div>
        <h2 id="foundationTitle"></h2>
        <p id="foundationText"></p>
    </section>

<!-- DOCUMENTS: Контейнер восьми документов -->
    <section class="discover-documents" id="discoverDocuments"></section>

<!-- FOOTER: Нижняя навигация -->
    <section class="discover-bottom">
        <p id="discoverFooter"></p>
        <a class="back-home" href="../index.html" id="backHome" data-nav-sound="home"></a>
    </section>
</main>
</div>

<!-- DOCUMENT MODAL: Просмотр документа -->
<div class="document-modal" id="documentModal">
    <div class="document-modal-box">
        <div class="modal-top">
            <h2 class="modal-title" id="modalTitle"></h2>
            <button class="modal-close" id="modalClose" type="button">×</button>
        </div>
        <div class="modal-text" id="modalText"></div>
    </div>
</div>

<!-- MAIN SYSTEM: Существующие системы сайта -->
<script src="../js/main.js"></script>
<script src="../js/language.js"></script>

<!-- DISCOVER SYSTEM: Загрузка локализации и восьми документов -->
<script>
document.addEventListener("DOMContentLoaded", async () => {

    /* LANGUAGE: Используем язык, выбранный на главной */
    const language =
        localStorage.getItem("votzet-language") || "en";

    /* DOCUMENT ORDER: Окончательный порядок восьми документов */
    const documentOrder = [
        "mission",
        "vision",
        "manifesto",
        "philosophy",
        "canon",
        "constitution",
        "codex",
        "code"
    ];

    try {

        /* LOCALIZATION: Загружаем common и discover одновременно */
        const [commonResponse, discoverResponse] =
            await Promise.all([
                fetch(`../locales/${language}/common.json`),
                fetch(`../locales/${language}/discover.json`)
            ]);

        /* FALLBACK: Если выбранный язык не имеет файлов */
        if (!commonResponse.ok || !discoverResponse.ok) {
            throw new Error(
                `Localization files unavailable for language: ${language}`
            );
        }

        const [common, discover] =
            await Promise.all([
                commonResponse.json(),
                discoverResponse.json()
            ]);

        document.documentElement.lang = language;

        /* NAVIGATION: Подписи внутреннего меню */
        document.getElementById("navHome").textContent =
            common.home || "Home";

        document.getElementById("navExplore").textContent =
            common.explore || "Explore";

        document.getElementById("navDiscover").textContent =
            common.discover || "Discover";

        /* HERO LABEL: Вместо "Познать" показываем VotZet */
        document.getElementById("discoverLabel").textContent =
            "VotZet";

        /* HERO CONTENT: Заголовок и описание */
        document.getElementById("discoverTitle").textContent =
            discover.title || "";

        document.getElementById("discoverSubtitle").textContent =
            discover.subtitle || "";

        /* FOUNDATION: Заголовок восьми документов */
        document.getElementById("foundationLabel").textContent =
            common.ourFoundation || "Our Foundation";

        document.getElementById("foundationTitle").textContent =
            common.eightDocuments || "Eight Documents";

        document.getElementById("foundationText").textContent =
            common.foundationDescription ||
            "The ideas and principles that form the foundation of VotZet.";

        /* FOOTER: Нижний текст */
        document.getElementById("discoverFooter").textContent =
            common.discoverFooter ||
            "Explore the foundation. Understand the idea. Then choose your world.";

        document.getElementById("backHome").textContent =
            common.home || "Home";

        /* DOCUMENTS: Создаём все восемь карточек */
        const container =
            document.getElementById("discoverDocuments");

        container.innerHTML = "";

        documentOrder.forEach((key, index) => {

            const documentData = discover[key];

            if (!documentData) {
                console.error(
                    `VotZet Discover: missing document "${key}"`
                );
                return;
            }

            const card =
                document.createElement("article");

            card.className = "discover-card";

            /* NUMBER: Номер документа */
            const number =
                document.createElement("div");

            number.className = "card-number";

            number.textContent =
                String(index + 1).padStart(2, "0");

            /* CONTENT: Название и краткое описание */
            const main =
                document.createElement("div");

            main.className = "card-main";

            const title =
                document.createElement("h3");

            title.textContent =
                documentData.title || "";

            const short =
                document.createElement("p");

            short.textContent =
                documentData.short || "";

            main.appendChild(title);
            main.appendChild(short);

            /* BUTTON: Открытие документа */
            const button =
                document.createElement("button");

            button.className = "document-button";
            button.type = "button";
            button.textContent = "→";

            button.addEventListener("click", () => {
                openDocument(documentData);
            });

            card.appendChild(number);
            card.appendChild(main);
            card.appendChild(button);

            container.appendChild(card);
        });

    } catch (error) {

        /* ERROR: Не ломаем страницу при ошибке загрузки */
        console.error(
            "VotZet Discover loading error:",
            error
        );
    }

    /* MODAL: Открытие документа */
    function openDocument(documentData) {

        document.getElementById("modalTitle").textContent =
            documentData.title || "";

        const modalText =
            document.getElementById("modalText");

        modalText.innerHTML = "";

        const text =
            documentData.text || "";

        if (text.trim()) {

            text.split(/\n\s*\n/)
                .forEach(paragraph => {

                    const p =
                        document.createElement("p");

                    p.textContent =
                        paragraph.trim();

                    modalText.appendChild(p);
                });

        } else {

            const p =
                document.createElement("p");

            p.textContent = "";

            modalText.appendChild(p);
        }

        document.getElementById("documentModal")
            .classList.add("open");

        document.body.style.overflow = "hidden";
    }

    /* MODAL: Закрытие */
    function closeDocument() {

        document.getElementById("documentModal")
            .classList.remove("open");

        document.body.style.overflow = "";
    }

    document.getElementById("modalClose")
        .addEventListener("click", closeDocument);

    document.getElementById("documentModal")
        .addEventListener("click", event => {

            if (event.target.id === "documentModal") {
                closeDocument();
            }
        });

    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {
            closeDocument();
        }
    });

});
</script>

</body>
</html>
